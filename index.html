hrase":"They picked over the fruit carefully.","meaning":"〜念入りに調べて選ぶ、〜を吟味する","note":"【例文訳】彼らは果物を慎重に選別した。","etymology":"【語源イメージ】pick over：上から“選り分ける”","preposition":"over は『上を覆う/越える』。支配・終了・過剰にもつながる。"},{"id":1789,"section":"Section 18 (準1級)","word":"pick through ~","phrase":"She picked through the documents for errors.","meaning":"〜の中をくまなく探す","note":"【例文訳】彼女は書類を調べて誤りを探した。","etymology":"【語源イメージ】pick through：中を“掘る”→探す","preposition":"through は『通り抜ける』。過程を最後まで抜ける感覚。"},{"id":1790,"section":"Section 18 (準1級)","word":"pile up","phrase":"Work began to pile up on my desk.","meaning":"(仕事・借金などが)どんどんたまる、山積する","note":"【例文訳】仕事が机の上に積み上がり始めた。","etymology":"【語源イメージ】pile up：上に“積む”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1791,"section":"Section 18 (準1級)","word":"pin down ~","phrase":"The police pinned down the suspect’s location.","meaning":"〜を押さえつける、〜を動けなくする","note":"【例文訳】警察は容疑者の居場所を特定した。","etymology":"【語源イメージ】pin down：下に“固定する”→特定","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1792,"section":"Section 18 (準1級)","word":"play down ~","phrase":"He tried to play down the mistake.","meaning":"〜を(実際より)重要でないように見せようとする","note":"【例文訳】彼はそのミスを軽く見せようとした。","etymology":"【語源イメージ】play down：下に“押し下げる”→軽視","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1793,"section":"Section 18 (準1級)","word":"play out (~)","phrase":"The drama played out exactly as expected.","meaning":"(物事・状況が)展開する、徐々に進展する、〜を最後まで演じる","note":"【例文訳】そのドラマは予想通り展開した。","etymology":"【語源イメージ】play out：外へ“展開する”","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1794,"section":"Section 18 (準1級)","word":"play up ~","phrase":"She played up her achievements during the interview.","meaning":"〜を誇張する、〜強調する","note":"【例文訳】彼女は面接で自分の実績を強調した。","etymology":"【語源イメージ】play up：上へ“持ち上げる”→強調","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1795,"section":"Section 18 (準1級)","word":"point to ~","phrase":"All evidence points to his involvement.","meaning":"(状況・証拠などが)〜を示す、(大事な点・理由など)を指摘する","note":"【例文訳】すべての証拠が彼の関与を示している。","etymology":"【語源イメージ】point to：方向を“指す”","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1796,"section":"Section 18 (準1級)","word":"pull back (~)","phrase":"The troops pulled back from the front line.","meaning":"後退する、〜を後退させる、思いとどまる","note":"【例文訳】軍隊は前線から撤退した。","etymology":"【語源イメージ】pull back：後ろに“引く”→撤退","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1797,"section":"Section 18 (準1級)","word":"pull in ~","phrase":"The train pulled in right on time.","meaning":"(観客・客など)を引きつける、(利益・金など)を得る","note":"【例文訳】電車はちょうど時間通りに到着した。","etymology":"【語源イメージ】pull in：中へ“引き入れる”→到着","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1798,"section":"Section 18 (準1級)","word":"pull off ~","phrase":"He pulled off a difficult performance.","meaning":"(困難なこと)をやってのける","note":"【例文訳】彼は難しい演技をやり遂げた。","etymology":"【語源イメージ】pull off：外へ“引き抜く”→成功","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1799,"section":"Section 18 (準1級)","word":"pull through ~","phrase":"She pulled through the illness.","meaning":"(病気・苦境など)を切り抜ける","note":"【例文訳】彼女は病気を乗り越えた。","etymology":"【語源イメージ】pull through：通り抜ける→回復","preposition":"through は『通り抜ける』。過程を最後まで抜ける感覚。"},{"id":1800,"section":"Section 18 (準1級)","word":"push for ~","phrase":"They are pushing for stricter regulations.","meaning":"〜を要求する、〜を得ようと努める","note":"【例文訳】彼らはより厳しい規制を求めている。","etymology":"【語源イメージ】push for：前へ“押す”→要求","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1801,"section":"Section 19 (準1級)","word":"push through ~","phrase":"They pushed through the new law despite opposition.","meaning":"(議案など)を通す、〜を突き進む","note":"【例文訳】彼らは反対にもかかわらず新法を押し通した。","etymology":"【語源イメージ】push through：中を“押し通す”","preposition":"through は『通り抜ける』。過程を最後まで抜ける感覚。"},{"id":1802,"section":"Section 19 (準1級)","word":"put down ~","phrase":"He put down his bag and sat on the bench.","meaning":"(金額)を手付金として払う、〜を書き留める","note":"【例文訳】彼はベンチに座るためにバッグを置いた。","etymology":"【語源イメージ】put down：下に“置く”","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1803,"section":"Section 19 (準1級)","word":"put forth ~","phrase":"She put forth a strong argument.","meaning":"(力など)を発揮する、(計画・案など)を提出する","note":"【例文訳】彼女は強い主張を述べた。","etymology":"【語源イメージ】put forth：前へ“出す”→提示","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1804,"section":"Section 19 (準1級)","word":"put toward ~","phrase":"He put the money toward his education.","meaning":"〜を提案[提出]する","note":"【例文訳】彼はそのお金を教育費に充てた。","etymology":"【語源イメージ】put toward：方向へ“充てる”","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1805,"section":"Section 19 (準1級)","word":"put in ~","phrase":"They put in a lot of effort.","meaning":"(設備など)を備え付ける、(金・時間・精力など)をつぎ込む","note":"【例文訳】彼らは多くの努力を注いだ。","etymology":"【語源イメージ】put in：中に“入れる”→投入","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1806,"section":"Section 19 (準1級)","word":"put A through (to B)","phrase":"I’ll put you through to the manager.","meaning":"Aの電話を(Bに)つなぐ","note":"【例文訳】あなたをマネージャーにつなぎます。","etymology":"【語源イメージ】put A through：Aを“通す”→電話をつなぐ","preposition":"through は『通り抜ける』。過程を最後まで抜ける感覚。"},{"id":1807,"section":"Section 19 (準1級)","word":"read off ~","phrase":"She read off the numbers from the list.","meaning":"(リストなど)を読み上げる","note":"【例文訳】彼女はリストから数字を読み上げた。","etymology":"【語源イメージ】read off：上から“読み取る”","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1808,"section":"Section 19 (準1級)","word":"refrain from doing ~","phrase":"Please refrain from smoking here.","meaning":"〜するのを控える、〜するのをやめる","note":"【例文訳】ここでは喫煙を控えてください。","etymology":"【語源イメージ】refrain from：〜から“離れる”→控える","preposition":"from は『起点』。場所・時間・原因の出発点。"},{"id":1809,"section":"Section 19 (準1級)","word":"regardless of ~","phrase":"Regardless of the weather, the event will continue.","meaning":"〜に(も)かかわらず、〜にかまわず","note":"【例文訳】天候に関係なくイベントは続行される。","etymology":"【語源イメージ】regardless of：〜を“気にせず”","preposition":"of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。"},{"id":1810,"section":"Section 19 (準1級)","word":"roll in (~)","phrase":"Donations began to roll in.","meaning":"(金など)がたくさんある、転がり込む、どっと集まる","note":"【例文訳】寄付が次々と集まり始めた。","etymology":"【語源イメージ】roll in：中へ“転がり込む”→続々来る","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1811,"section":"Section 19 (準1級)","word":"roll up ~","phrase":"He rolled up the sleeves of his shirt.","meaning":"〜をくるくると巻く、(そで・すそ)をまくり上げる","note":"【例文訳】彼はシャツの袖をまくり上げた。","etymology":"【語源イメージ】roll up：上へ“巻く”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1812,"section":"Section 19 (準1級)","word":"round off ~","phrase":"Let’s round off the discussion with final comments.","meaning":"〜を締めくくる、〜をうまく終える","note":"【例文訳】最後のコメントで議論を締めくくろう。","etymology":"【語源イメージ】round off：丸く“仕上げる”→締めくくる","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1813,"section":"Section 19 (準1級)","word":"round up ~","phrase":"The police rounded up the suspects.","meaning":"(散らばった人など)を集める、〜を逮捕する","note":"【例文訳】警察は容疑者を一斉に逮捕した。","etymology":"【語源イメージ】round up：丸く“集める”→一斉逮捕","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1814,"section":"Section 19 (準1級)","word":"rule out ~","phrase":"We can’t rule out the possibility of error.","meaning":"〜を排除する、〜を除外する","note":"【例文訳】誤りの可能性を排除できない。","etymology":"【語源イメージ】rule out：外へ“除外する”","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1815,"section":"Section 19 (準1級)","word":"run against ~","phrase":"He ran against a strong opponent.","meaning":"〜に不利になる","note":"【例文訳】彼は強い対戦相手と戦った。","etymology":"【語源イメージ】run against：〜に“ぶつかる”→対立","preposition":"against は『ぶつかる/反対して』。"},{"id":1816,"section":"Section 19 (準1級)","word":"run down ~","phrase":"The battery ran down quickly.","meaning":"(車・運転手が)〜をひく、〜のことを悪く言う、〜を突き止める","note":"【例文訳】バッテリーはすぐに切れた。","etymology":"【語源イメージ】run down：下へ“落ちる”→消耗","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1817,"section":"Section 19 (準1級)","word":"run through ~","phrase":"She ran through the report before the meeting.","meaning":"ざっと〜を読み上げる[に目を通す]","note":"【例文訳】彼女は会議前に報告書に目を通した。","etymology":"【語源イメージ】run through：通り“抜ける”→目を通す","preposition":"through は『通り抜ける』。過程を最後まで抜ける感覚。"},{"id":1818,"section":"Section 19 (準1級)","word":"scoop up ~","phrase":"He scooped up the toys from the floor.","meaning":"〜を抱き上げる、〜をすくい上げる","note":"【例文訳】彼は床の上のおもちゃをすくい上げた。","etymology":"【語源イメージ】scoop up：上へ“すくう”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1819,"section":"Section 19 (準1級)","word":"scratch out ~","phrase":"She scratched out the wrong answer.","meaning":"〜を削除する、やっと(生計)を立てる","note":"【例文訳】彼女は間違った答えを消し線で消した。","etymology":"【語源イメージ】scratch out：線で“削る”→消す","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1820,"section":"Section 19 (準1級)","word":"see about ~","phrase":"I’ll see about getting you a ticket.","meaning":"〜を検討する、〜を手配する、〜を何とかする","note":"【例文訳】チケットを取れるか確認します。","etymology":"【語源イメージ】see about：〜を“見て回る”→手配する","preposition":"about は『周辺』。話題の周りを扱うので『〜について』になる。"},{"id":1821,"section":"Section 19 (準1級)","word":"see A off","phrase":"We went to the station to see him off.","meaning":"(空港・駅などで)Aを見送る","note":"【例文訳】私たちは彼を見送るために駅へ行った。","etymology":"【語源イメージ】see off：外へ“送り出す”","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1822,"section":"Section 19 (準1級)","word":"see through ~","phrase":"She saw through his lies immediately.","meaning":"〜を見抜く、〜を見破る、〜を通して見る","note":"【例文訳】彼女は彼の嘘をすぐに見抜いた。","etymology":"【語源イメージ】see through：通して“見る”→見抜く","preposition":"through は『通り抜ける』。過程を最後まで抜ける感覚。"},{"id":1823,"section":"Section 19 (準1級)","word":"sell out","phrase":"The concert tickets sold out in minutes.","meaning":"(期待を)裏切る、(ものが)売り切れる","note":"【例文訳】コンサートのチケットは数分で売り切れた。","etymology":"【語源イメージ】sell out：外へ“売り尽くす”","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1824,"section":"Section 19 (準1級)","word":"send for ~","phrase":"They sent for a doctor right away.","meaning":"(人・助けなど)を呼ぶ、〜に来てもらう","note":"【例文訳】彼らはすぐに医者を呼んだ。","etymology":"【語源イメージ】send for：〜を“呼び寄せる”","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1825,"section":"Section 19 (準1級)","word":"send out for ~","phrase":"We decided to send out for pizza.","meaning":"(食べ物)の出前を頼む","note":"【例文訳】私たちはピザを出前で頼むことにした。","etymology":"【語源イメージ】send out for：外へ“頼む”→出前","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。 / out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1826,"section":"Section 19 (準1級)","word":"set aside ~","phrase":"She set aside money for emergencies.","meaning":"(時間・金など)をとっておく、〜をわきへどける","note":"【例文訳】彼女は緊急時のためにお金を取っておいた。","etymology":"【語源イメージ】set aside：横に“置く”→取っておく","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1827,"section":"Section 19 (準1級)","word":"set down ~","phrase":"He set down his thoughts in a notebook.","meaning":"〜を書き留める","note":"【例文訳】彼はノートに自分の考えを書き留めた。","etymology":"【語源イメージ】set down：下に“置く”→書く","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1828,"section":"Section 19 (準1級)","word":"set in","phrase":"Winter began to set in early this year.","meaning":"(季節・流行・好ましくないものなどが)始まる、起こる","note":"【例文訳】今年は冬が早く始まった。","etymology":"【語源イメージ】set in：中に“入り込む”→始まる","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1829,"section":"Section 19 (準1級)","word":"set off (~)","phrase":"The smoke set off the fire alarm.","meaning":"出発する、〜を引き起こす、〜を作動させる","note":"【例文訳】煙が火災報知器を作動させた。","etymology":"【語源イメージ】set off：外へ“作動させる”→引き起こす","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1830,"section":"Section 19 (準1級)","word":"set out to do ~","phrase":"They set out to improve the system.","meaning":"〜することに着手する、〜し始める","note":"【例文訳】彼らはシステム改善に乗り出した。","etymology":"【語源イメージ】set out：外へ“出る”→着手","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1831,"section":"Section 19 (準1級)","word":"set up ~","phrase":"They set up a new company.","meaning":"(会合など)を準備する、〜を設置する、(会社・組織など)を作る","note":"【例文訳】彼らは新しい会社を設立した。","etymology":"【語源イメージ】set up：上へ“立てる”→設立","preposition":"up＝立ち上げる。仕組み・会議・会社を設置する。"},{"id":1832,"section":"Section 19 (準1級)","word":"settle down","phrase":"He decided to settle down in the countryside.","meaning":"ゆったりとくつろぐ、落ち着く、定住する","note":"【例文訳】彼は田舎で落ち着いて暮らすことにした。","etymology":"【語源イメージ】settle down：下に“落ち着く”","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1833,"section":"Section 19 (準1級)","word":"settle up (with ~)","phrase":"Let’s settle up before we leave.","meaning":"(〜と)精算する、(〜に)勘定を支払う","note":"【例文訳】出発前に清算しよう。","etymology":"【語源イメージ】settle up：上へ“清算する”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1834,"section":"Section 19 (準1級)","word":"shake up ~","phrase":"The news shook up the entire community.","meaning":"〜を刷新する、〜を動揺させる、〜を奮い立たせる","note":"【例文訳】そのニュースは地域全体に衝撃を与えた。","etymology":"【語源イメージ】shake up：上へ“揺さぶる”→動揺","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1835,"section":"Section 19 (準1級)","word":"show off (~)","phrase":"He likes to show off his new car.","meaning":"いいところを見せる、〜を見せびらかす","note":"【例文訳】彼は新しい車を自慢したがる。","etymology":"【語源イメージ】show off：外へ“見せびらかす”","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1836,"section":"Section 19 (準1級)","word":"show up","phrase":"She finally showed up at the meeting.","meaning":"現れる、やってくる","note":"【例文訳】彼女はついに会議に姿を見せた。","etymology":"【語源イメージ】show up：上に“現れる”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1837,"section":"Section 19 (準1級)","word":"sign up for ~","phrase":"I signed up for the workshop.","meaning":"(署名して)〜に参加する、(受講など)の届けを出す","note":"【例文訳】私はそのワークショップに申し込んだ。","etymology":"【語源イメージ】sign up：上に“名前を書く”→登録","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。 / up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1838,"section":"Section 19 (準1級)","word":"single out ~","phrase":"They singled out one student for special praise.","meaning":"〜を(特に)選び出す","note":"【例文訳】彼らはある生徒を特別に称賛した。","etymology":"【語源イメージ】single out：一つを“外へ抜く”→選び出す","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1839,"section":"Section 19 (準1級)","word":"sink in","phrase":"The truth slowly sank in.","meaning":"十分に理解される、分かってもらう","note":"【例文訳】その真実はゆっくりと理解された。","etymology":"【語源イメージ】sink in：中に“沈む”→理解が染み込む","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1840,"section":"Section 19 (準1級)","word":"sit back","phrase":"Just sit back and relax.","meaning":"何もしないで[手をこまねいて]いる、くつろぐ、(いすに)深く座る","note":"【例文訳】ただ座ってゆっくりしていればいい。","etymology":"【語源イメージ】sit back：後ろに“座る”→くつろぐ","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1841,"section":"Section 19 (準1級)","word":"sit by","phrase":"He refused to sit by while injustice happened.","meaning":"(悪い事態を)黙って見ている、傍観する","note":"【例文訳】彼は不正が起きるのを黙って見ていることを拒んだ。","etymology":"【語源イメージ】sit by：そばに“座る”→傍観","preposition":"by は『そば』から『手段・行為者・期限』へ広がる。"},{"id":1842,"section":"Section 19 (準1級)","word":"sit in","phrase":"She sat in on the meeting as an observer.","meaning":"参加する、見学[参観]する、代理を務める","note":"【例文訳】彼女はオブザーバーとして会議に参加した。","etymology":"【語源イメージ】sit in：中に“座る”→参加","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1843,"section":"Section 19 (準1級)","word":"skim over ~","phrase":"He skimmed over the report quickly.","meaning":"〜をざっと見る、〜表面的に扱う","note":"【例文訳】彼は報告書をざっと読み流した。","etymology":"【語源イメージ】skim over：上を“すべる”→ざっと読む","preposition":"over は『上を覆う/越える』。支配・終了・過剰にもつながる。"},{"id":1844,"section":"Section 19 (準1級)","word":"slip by","phrase":"Time slipped by without us noticing.","meaning":"(時・機会が)いつの間にか過ぎる","note":"【例文訳】時間は気づかぬうちに過ぎ去った。","etymology":"【語源イメージ】slip by：横を“すり抜ける”→過ぎる","preposition":"by は『そば』から『手段・行為者・期限』へ広がる。"},{"id":1845,"section":"Section 19 (準1級)","word":"smooth over ~","phrase":"They tried to smooth over the disagreement.","meaning":"(話し合いをして)(問題・困難など)を処理しやすくする","note":"【例文訳】彼らはその対立を丸く収めようとした。","etymology":"【語源イメージ】smooth over：上から“なめらかにする”→丸く収める","preposition":"over は『上を覆う/越える』。支配・終了・過剰にもつながる。"},{"id":1846,"section":"Section 19 (準1級)","word":"speak for ~","phrase":"She spoke for the entire group.","meaning":"〜を代表して意見を述べる、〜を代弁する、〜への支持を表明する","note":"【例文訳】彼女はグループ全体を代表して話した。","etymology":"【語源イメージ】speak for：〜の“ために話す”→代表","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1847,"section":"Section 19 (準1級)","word":"split up (~)","phrase":"The team decided to split up into smaller groups.","meaning":"別れる、分裂する、〜を分裂させる","note":"【例文訳】チームは小さなグループに分かれることにした。","etymology":"【語源イメージ】split up：上へ“割る”→分裂","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1848,"section":"Section 19 (準1級)","word":"spring from ~","phrase":"His idea springs from years of experience.","meaning":"〜から生じる、(人が)〜の出である","note":"【例文訳】彼のアイデアは長年の経験から生まれている。","etymology":"【語源イメージ】spring from：〜から“跳ね出る”→由来","preposition":"from＝起点。原因・出身がそこから出る。"},{"id":1849,"section":"Section 19 (準1級)","word":"spring up","phrase":"New shops are springing up everywhere.","meaning":"急に生まれる、急成長する","note":"【例文訳】新しい店があちこちに急に現れている。","etymology":"【語源イメージ】spring up：上に“跳ね上がる”→急に現れる","preposition":"up＝下からぱっと出る。急に現れる・生じる。"},{"id":1850,"section":"Section 19 (準1級)","word":"stand down (as ~)","phrase":"He decided to stand down as chairman.","meaning":"(公職など)を辞任する","note":"【例文訳】彼は議長を辞任することにした。","etymology":"【語源イメージ】stand down：下に“立つ”→辞任","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1851,"section":"Section 19 (準1級)","word":"stand for ~","phrase":"This symbol stands for peace.","meaning":"〜の略である、〜を意味する、〜を支持する","note":"【例文訳】このシンボルは平和を表す。","etymology":"【語源イメージ】stand for：〜を“支える”→象徴","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1852,"section":"Section 19 (準1級)","word":"stand up to ~","phrase":"She stood up to the bully.","meaning":"〜に抵抗する、〜に立ち向かう、〜に耐える","note":"【例文訳】彼女はいじめっ子に立ち向かった。","etymology":"【語源イメージ】stand up to：〜に“立ち向かう”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1853,"section":"Section 19 (準1級)","word":"stay off ~","phrase":"Please stay off the grass.","meaning":"(健康のため)〜を控える、〜に近づかない","note":"【例文訳】芝生に入らないでください。","etymology":"【語源イメージ】stay off：〜から“離れる”","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1854,"section":"Section 19 (準1級)","word":"step down [aside]","phrase":"He decided to step down from his position.","meaning":"辞任する","note":"【例文訳】彼はその職を辞任することにした。","etymology":"【語源イメージ】step down：下に“降りる”→辞任","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1855,"section":"Section 19 (準1級)","word":"stick around","phrase":"Let’s stick around until the show starts.","meaning":"そこらで待つ、帰らずにいる","note":"【例文訳】ショーが始まるまでここにいよう。","etymology":"【語源イメージ】stick around：周囲に“留まる”","preposition":"around は『周辺をぐるり』。"},{"id":1856,"section":"Section 19 (準1級)","word":"stick to [by] ~","phrase":"You should stick to your original plan.","meaning":"(主義など)を堅持する、〜をやり続ける","note":"【例文訳】あなたは元の計画に従うべきだ。","etymology":"【語源イメージ】stick to：〜に“くっつく”→固守","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1857,"section":"Section 19 (準1級)","word":"stick up for ~","phrase":"He always sticks up for his friends.","meaning":"〜をあくまでも擁護する、〜を支持する","note":"【例文訳】彼はいつも友人をかばう。","etymology":"【語源イメージ】stick up for：上に“持ち上げて守る”→擁護","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。 / up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1858,"section":"Section 19 (準1級)","word":"stick with ~","phrase":"She decided to stick with the project.","meaning":"〜を最後までやり抜く、〜を続けてする","note":"【例文訳】彼女はそのプロジェクトを続けることにした。","etymology":"【語源イメージ】stick with：〜と“一緒にいる”→続ける","preposition":"with は『一緒に/伴って』。道具・相手・付帯状況を表す。"},{"id":1859,"section":"Section 19 (準1級)","word":"stir in ~","phrase":"Stir in the sugar until dissolved.","meaning":"〜を入れてかき混ぜる","note":"【例文訳】砂糖が溶けるまで混ぜてください。","etymology":"【語源イメージ】stir in：中に“混ぜる”","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1860,"section":"Section 19 (準1級)","word":"stir up ~","phrase":"The scandal stirred up public anger.","meaning":"(騒ぎなど)を引き起こす、(想像力・記憶など)をかき立てる","note":"【例文訳】そのスキャンダルは世論の怒りをかき立てた。","etymology":"【語源イメージ】stir up：上へ“かき立てる”→刺激・扇動","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1861,"section":"Section 19 (準1級)","word":"sum up ~","phrase":"She summed up the main points at the end.","meaning":"〜を要約する","note":"【例文訳】彼女は最後に要点をまとめた。","etymology":"【語源イメージ】sum up：上へ“まとめる”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1862,"section":"Section 19 (準1級)","word":"take in ~","phrase":"I couldn’t take in all the information at once.","meaning":"〜を摂取する、(光景など)を観察する、〜をだます、〜を理解する","note":"【例文訳】私は一度にすべての情報を理解できなかった。","etymology":"【語源イメージ】take in：中に“取り入れる”→理解","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1863,"section":"Section 19 (準1級)","word":"tale on ~","phrase":"He took on extra work during the busy season.","meaning":"(特にきつい仕事・責任)を引き受ける","note":"【例文訳】彼は忙しい時期に追加の仕事を引き受けた。","etymology":"【語源イメージ】take on：上に“背負う”→引き受ける","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1864,"section":"Section 19 (準1級)","word":"take over ~","phrase":"She took over the project from her manager.","meaning":"〜を引き継ぐ、〜を買収する、〜を占領する","note":"【例文訳】彼女はマネージャーからそのプロジェクトを引き継いだ。","etymology":"【語源イメージ】take over：上に“乗り換える”→引き継ぐ","preposition":"over＝越えて上にかぶさる。引き継ぐ・支配を取る。"},{"id":1865,"section":"Section 19 (準1級)","word":"take up ~","phrase":"He decided to take up painting.","meaning":"〜を趣味[職業・学問]として始める、(問題など)を取り上げる","note":"【例文訳】彼は絵を描くことを始めることにした。","etymology":"【語源イメージ】take up：上へ“持ち上げる”→始める","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1866,"section":"Section 19 (準1級)","word":"talk down to A","phrase":"He tends to talk down to younger employees.","meaning":"Aを見下した調子で話す","note":"【例文訳】彼は若い社員に見下した話し方をする傾向がある。","etymology":"【語源イメージ】talk down to：下に“話す”→見下す","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1867,"section":"Section 19 (準1級)","word":"talk A into doing ~","phrase":"She talked him into joining the club.","meaning":"Aを説得して〜させる","note":"【例文訳】彼女は彼をクラブに参加するよう説得した。","etymology":"【語源イメージ】talk A into：話して“中へ入れ込む”→説得","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1868,"section":"Section 19 (準1級)","word":"talk up ~","phrase":"He talked up the benefits of the plan.","meaning":"(人・もの)を実際以上に興味深いもののように話す","note":"【例文訳】彼はその計画の利点を強調した。","etymology":"【語源イメージ】talk up：上へ“持ち上げる”→強調","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1869,"section":"Section 19 (準1級)","word":"tear down ~","phrase":"They tore down the old building.","meaning":"〜を取り壊す、〜を解体する、〜を殴り倒す","note":"【例文訳】彼らは古い建物を取り壊した。","etymology":"【語源イメージ】tear down：下へ“壊す”","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1870,"section":"Section 19 (準1級)","word":"tell on ~","phrase":"The stress began to tell on him.","meaning":"(特に子供が)〜のことを告げ口する、〜にこたえる","note":"【例文訳】ストレスが彼に影響し始めた。","etymology":"【語源イメージ】tell on：〜に“現れる”→影響する","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1871,"section":"Section 19 (準1級)","word":"the other way around","phrase":"It’s actually the other way around.","meaning":"(方角・事情などが)逆に[で]","note":"【例文訳】実際はその逆だ。","etymology":"【語源イメージ】the other way around：向きが“逆”","preposition":"around は『周辺をぐるり』。"},{"id":1872,"section":"Section 19 (準1級)","word":"throw off ~","phrase":"The sudden noise threw off my concentration.","meaning":"(衣服など)をさっと脱ぐ[脱ぎ捨てる]、〜を払いのける","note":"【例文訳】突然の音で集中力が乱れた。","etymology":"【語源イメージ】throw off：外へ“投げる”→乱す","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1873,"section":"Section 19 (準1級)","word":"throw up (~)","phrase":"The smell made him throw up.","meaning":"嘔吐する、(食べ物)を吐く","note":"【例文訳】そのにおいで彼は吐いてしまった。","etymology":"【語源イメージ】throw up：上へ“吐き出す”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1874,"section":"Section 19 (準1級)","word":"tidy up ~","phrase":"She tidied up the room before guests arrived.","meaning":"(部屋・家・机など)を片付ける、〜を整理する","note":"【例文訳】彼女は客が来る前に部屋を片付けた。","etymology":"【語源イメージ】tidy up：上へ“整える”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1875,"section":"Section 19 (準1級)","word":"tie up ~","phrase":"They tied up the boat at the dock.","meaning":"忙しくて身動きできない、〜を固く縛る","note":"【例文訳】彼らは船を桟橋に固定した。","etymology":"【語源イメージ】tie up：上へ“結ぶ”→固定","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1876,"section":"Section 19 (準1級)","word":"tip over (~)","phrase":"The strong wind tipped over the sign.","meaning":"ひっくり返る、倒れる、〜をひっくり返す","note":"【例文訳】強風で看板が倒れた。","etymology":"【語源イメージ】tip over：上から“倒す”","preposition":"over は『上を覆う/越える』。支配・終了・過剰にもつながる。"},{"id":1877,"section":"Section 19 (準1級)","word":"touch up ~","phrase":"She touched up the photo before printing it.","meaning":"(絵・文章・化粧など)を手直しする、〜を修正する","note":"【例文訳】彼女は印刷前に写真を修正した。","etymology":"【語源イメージ】touch up：上へ“手を加える”→修正","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1878,"section":"Section 19 (準1級)","word":"track down ~","phrase":"They tracked down the missing files.","meaning":"〜を追跡して捕らえる、〜を追い詰める","note":"【例文訳】彼らは紛失したファイルを突き止めた。","etymology":"【語源イメージ】track down：下へ“追い詰める”→突き止める","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1879,"section":"Section 19 (準1級)","word":"trip up (A)","phrase":"He tripped up his opponent during the debate.","meaning":"Aをつまずかせる、つまずく、しくじる","note":"【例文訳】彼は討論中に相手のミスを誘った。","etymology":"【語源イメージ】trip up：上へ“つまずかせる”→ミスを誘う","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1880,"section":"Section 19 (準1級)","word":"try out ~","phrase":"We should try out the new software.","meaning":"〜を試してみる、〜の効果を試す","note":"【例文訳】新しいソフトを試してみよう。","etymology":"【語源イメージ】try out：外へ“試す”","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1881,"section":"Section 19 (準1級)","word":"tune in (to ~)","phrase":"I tune in to the news every morning.","meaning":"(局・番組などに)テレビ[ラジオ]のチャンネルを合わせる","note":"【例文訳】私は毎朝ニュースにチャンネルを合わせる。","etymology":"【語源イメージ】tune in：中へ“合わせる”→視聴","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1882,"section":"Section 19 (準1級)","word":"tune up (~)","phrase":"The band tuned up before the concert.","meaning":"(楽器)を調律する、(エンジン・機械など)を整備する、調律する","note":"【例文訳】バンドはコンサート前に音合わせをした。","etymology":"【語源イメージ】tune up：上へ“調整する”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1883,"section":"Section 19 (準1級)","word":"turn around (~)","phrase":"She turned around the failing project.","meaning":"(商売・経済など)を好転させる、〜の向きを変える、好転する","note":"【例文訳】彼女は失敗寸前のプロジェクトを立て直した。","etymology":"【語源イメージ】turn around：向きを“変える”→立て直す","preposition":"around は『周辺をぐるり』。"},{"id":1884,"section":"Section 19 (準1級)","word":"turn away ~","phrase":"They turned away the visitors at the gate.","meaning":"〜を追い払う、(客など)の入場を断る、〜を背ける","note":"【例文訳】彼らは門で訪問者を追い返した。","etymology":"【語源イメージ】turn away：外へ“向ける”→追い返す","preposition":"away は『離れて』。"},{"id":1885,"section":"Section 19 (準1級)","word":"turn in (~)","phrase":"Please turn in your assignments by Friday.","meaning":"〜を提出する、寝る","note":"【例文訳】金曜日までに課題を提出してください。","etymology":"【語源イメージ】turn in：中へ“提出する”","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1886,"section":"Section 19 (準1級)","word":"turn out","phrase":"It turned out that he was right.","meaning":"であることがわかる、集まる","note":"【例文訳】結局、彼が正しかったことが判明した。","etymology":"【語源イメージ】turn out：外へ“結果が出る”→判明","preposition":"out＝外に現れて結果が見える。結局〜だと分かる。"},{"id":1887,"section":"Section 19 (準1級)","word":"turn to ~","phrase":"When in trouble, she turns to her friends.","meaning":"〜に頼る、(犯罪・悪習など)に走る、〜に取りかかる","note":"【例文訳】困ったとき、彼女は友人に頼る。","etymology":"【語源イメージ】turn to：〜へ“向く”→頼る","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1888,"section":"Section 19 (準1級)","word":"walk off [away] with ~","phrase":"He walked off with the first prize.","meaning":"〜を盗む、(賞など)をあっさり手に入れる","note":"【例文訳】彼は一等賞をさらっていった。","etymology":"【語源イメージ】walk off with：歩いて“持ち去る”→勝ち取る","preposition":"off は『離れる』。接触・予定・作動状態から離す。 / with は『一緒に/伴って』。道具・相手・付帯状況を表す。"},{"id":1889,"section":"Section 19 (準1級)","word":"wander off","phrase":"The child wandered off during the event.","meaning":"はぐれる、(道路・場所から)外れる、(主題から)脱線する","note":"【例文訳】その子どもはイベント中にふらっと離れた。","etymology":"【語源イメージ】wander off：外へ“離れる”","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1890,"section":"Section 19 (準1級)","word":"want for ~","phrase":"They want for nothing after the success.","meaning":"〜を欠いている","note":"【例文訳】成功後、彼らは何一つ不足していない。","etymology":"【語源イメージ】want for：〜を“欠く”→不足する","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1891,"section":"Section 19 (準1級)","word":"wash away ~","phrase":"The flood washed away the bridge.","meaning":"〜を洗い流す、(記憶・感情など)を洗い去る","note":"【例文訳】洪水が橋を流し去った。","etymology":"【語源イメージ】wash away：水で“流す”","preposition":"away は『離れて』。"},{"id":1892,"section":"Section 19 (準1級)","word":"wash down ~","phrase":"Please wash down the equipment after use.","meaning":"(食べ物など)を流し込む、〜を洗い流す","note":"【例文訳】使用後は機材を洗い流してください。","etymology":"【語源イメージ】wash down：下へ“洗い流す”","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1893,"section":"Section 19 (準1級)","word":"watch over ~","phrase":"She watches over her younger siblings.","meaning":"〜の世話をする、〜を見守る、〜を監視する","note":"【例文訳】彼女は弟妹たちを見守っている。","etymology":"【語源イメージ】watch over：上から“見守る”","preposition":"over は『上を覆う/越える』。支配・終了・過剰にもつながる。"},{"id":1894,"section":"Section 19 (準1級)","word":"wear off","phrase":"The pain will wear off soon.","meaning":"(薬効・印象・痛みなどが)しだいに弱まる、すり減ってなくなる","note":"【例文訳】痛みはすぐに消える。","etymology":"【語源イメージ】wear off：摩耗して“消える”","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1895,"section":"Section 19 (準1級)","word":"wear out ~","phrase":"The long trip wore out the travelers.","meaning":"〜を疲れ果てさせる","note":"【例文訳】長旅で旅行者たちは疲れ果てた。","etymology":"【語源イメージ】wear out：使い切って“疲れさせる”","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1896,"section":"Section 19 (準1級)","word":"weigh on ~","phrase":"The heavy workload weighed on him.","meaning":"〜に重くのしかかる、〜を圧迫する、〜を苦しめる","note":"【例文訳】重い仕事量が彼にのしかかった。","etymology":"【語源イメージ】weigh on：上に“重く乗る”","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1897,"section":"Section 19 (準1級)","word":"win over ~","phrase":"She won over the audience with her speech.","meaning":"〜を説得する","note":"【例文訳】彼女はスピーチで聴衆を味方につけた。","etymology":"【語源イメージ】win over：上に“勝ち取る”→味方にする","preposition":"over は『上を覆う/越える』。支配・終了・過剰にもつながる。"},{"id":1898,"section":"Section 19 (準1級)","word":"wipe out ~","phrase":"The disease wiped out the entire crop.","meaning":"〜を消滅[絶滅]させる、〜を撲滅する","note":"【例文訳】その病気は作物を全滅させた。","etymology":"【語源イメージ】wipe out：外へ“拭い去る”→全滅","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1899,"section":"Section 19 (準1級)","word":"work out ~","phrase":"They worked out a solution together.","meaning":"(計画・対策など)を練る、(問題)を解決する、〜を計算する","note":"【例文訳】彼らは一緒に解決策を考え出した。","etymology":"【語源イメージ】work out：外へ“解決を出す”","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1900,"section":"Section 19 (準1級)","word":"wrap up ~","phrase":"Let’s wrap up the meeting soon.","meaning":"(仕事・交渉など)を滞りなく終える","note":"【例文訳】そろそろ会議を締めくくろう。","etymology":"【語源イメージ】wrap up：上へ“包む”→締めくくる","preposition":"up＝完全に包み込む。仕事・会議をまとめて終える。"}];

        // --- タイトルの自動動的セット設定 ---
        const pageTitle = document.title || "英単語ハックマスター";
        document.getElementById('home-title').textContent = pageTitle.replace(/⚡/g, "").trim();

        // --- ストレージ & ステート管理 ---
        const storageKey = "HACK_MASTER_" + encodeURIComponent(pageTitle) + "_CLEARED_IDS";
        let clearedList = JSON.parse(localStorage.getItem(storageKey)) || [];

        let currentDeck = [];      
        let initialUniqueCount = 0;
        let currentIndex = 0;      
        let comboCount = 0;

        // DOMの取得
        const domScreenHome = document.getElementById('screen-home');
        const domScreenQuiz = document.getElementById('screen-quiz');
        const domSectionList = document.getElementById('section-list');
        const domTotalProgressPercent = document.getElementById('total-progress-percent');
        const domTotalProgressBar = document.getElementById('total-progress-bar');
        const domTotalProgressCount = document.getElementById('total-progress-count');
        const domQuizCount = document.getElementById('quiz-count');
        const domQuizProgressBar = document.getElementById('quiz-progress-bar');
        const domQuizComboBadge = document.getElementById('quiz-combo-badge');
        const domQuizComboCount = document.getElementById('quiz-combo-count');
        const domHeaderCombo = document.getElementById('header-combo');
        const domHeaderComboCount = document.getElementById('header-combo-count');
        const domQuizSectionTitle = document.getElementById('quiz-section-title');
        const domQuizHintMeaning = document.getElementById('quiz-hint-meaning');
        const domQuizBoostEtymology = document.getElementById('quiz-boost-etymology');
        const domQuizBoostPreposition = document.getElementById('quiz-boost-preposition');
        const domQuizPhrase = document.getElementById('quiz-phrase');
        const domQuizAnswerZone = document.getElementById('quiz-answer-zone');
        const domQuizCorrectWord = document.getElementById('quiz-correct-word');
        const domBtnReveal = document.getElementById('btn-reveal');
        const domQuizChoicePad = document.getElementById('quiz-choice-pad');
        const domBtnCorrect = document.getElementById('btn-correct');
        const domBtnWrong = document.getElementById('btn-wrong');
        const domBtnBack = document.getElementById('btn-back');
        const domBtnResetAll = document.getElementById('btn-reset-all');
        const domBtnSpeakWord = document.getElementById('btn-speak-word');
        const domBtnSpeakPhrase = document.getElementById('btn-speak-phrase');

        // --- ホーム画面の描画 ---
        function renderHome() {
            domScreenQuiz.classList.add('hidden');
            domScreenHome.classList.remove('hidden');

            const totalWords = MASTER_DATA.length;
            const clearedWords = clearedList.filter(id => MASTER_DATA.some(m => m.id === id)).length;
            const totalPercent = totalWords > 0 ? Math.round((clearedWords / totalWords) * 100) : 0;
            
            domTotalProgressPercent.textContent = `${totalPercent}%`;
            domTotalProgressBar.style.width = `${totalPercent}%`;
            domTotalProgressCount.textContent = `完遂済み: ${clearedWords} / ${totalWords} 語`;

            const sections = [...new Set(MASTER_DATA.map(item => item.section))];
            domSectionList.innerHTML = '';

            sections.forEach(secName => {
                const secItems = MASTER_DATA.filter(item => item.section === secName);
                const secCleared = secItems.filter(item => clearedList.includes(item.id)).length;
                const secPercent = Math.round((secCleared / secItems.length) * 100);
                const isCompleted = secCleared === secItems.length;

                const div = document.createElement('div');
                div.className = `glass-card p-3.5 rounded-xl border flex flex-col justify-between items-stretch space-y-2 transition-all ${isCompleted ? 'border-emerald-500/30 bg-emerald-950/10' : 'border-slate-800 hover:border-slate-700'}`;
                
                div.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="text-sm font-bold text-slate-200">${secName}</h3>
                            <p class="text-[11px] text-slate-400 font-mono mt-0.5">進捗: ${secCleared} / ${secItems.length} 語</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xs font-black ${isCompleted ? 'text-emerald-400' : 'text-blue-400'} font-mono">${secPercent}%</span>
                        </div>
                    </div>
                    <div class="w-full bg-slate-900 h-1.5 rounded-full overflow-hidden">
                        <div class="progress-bar ${isCompleted ? 'bg-emerald-500' : 'bg-blue-500'} h-full" style="width: ${secPercent}%"></div>
                    </div>
                    <div class="flex space-x-2 pt-1">
                        <button onclick="startSession('${secName}')" class="flex-1 bg-slate-800 hover:bg-slate-700 text-xs font-bold py-2 rounded-lg transition-colors border border-slate-700/50">
                            ${isCompleted ? '🔄 復習スタート' : '⚡ 攻略開始'}
                        </button>
                        ${secCleared > 0 ? `
                            <button onclick="resetSectionProgress('${secName}')" class="text-[10px] text-slate-500 hover:text-rose-400 px-2 transition-colors">
                                ↺ リセット
                            </button>
                        ` : ''}
                    </div>
                `;
                domSectionList.appendChild(div);
            });
        }

        // --- クイズセッションの開始 ---
        function startSession(sectionName) {
            let targetItems = MASTER_DATA.filter(item => item.section === sectionName);
            currentDeck = targetItems.filter(item => !clearedList.includes(item.id));

            if (currentDeck.length === 0) {
                currentDeck = [...targetItems];
            }

            // ランダムシャッフル
            currentDeck.sort(() => Math.random() - 0.5);

            initialUniqueCount = currentDeck.length; 
            currentIndex = 0;
            comboCount = 0;

            updateComboUI();
            
            domScreenHome.classList.add('hidden');
            domScreenQuiz.classList.remove('hidden');
            
            showQuestion();
        }

        // --- 問題の提示 ---

        // --- 穴あき表示ヘルパー（熟語・be動詞・過去形・doing/～などの可変部分にも対応） ---
        function escapeRegExp(str) {
            return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeTargetExpression(targetWord) {
            return String(targetWord || "")
                .replace(/[（）]/g, " ")
                .replace(/\([^)]*\)/g, " ")
                .replace(/\[[^\]]*\]/g, " ")
                .replace(/[･・]/g, " ")
                .replace(/[〜]/g, "~")
                .replace(/…/g, " ")
                .replace(/\s+/g, " ")
                .trim();
        }

        function getVerbForms(base) {
            const irregulars = {
                "be": ["be", "am", "are", "is", "was", "were", "been", "being"],
                "take": ["take", "takes", "took", "taken", "taking"],
                "make": ["make", "makes", "made", "making"],
                "come": ["come", "comes", "came", "coming"],
                "go": ["go", "goes", "went", "gone", "going"],
                "get": ["get", "gets", "got", "gotten", "getting"],
                "give": ["give", "gives", "gave", "given", "giving"],
                "do": ["do", "does", "did", "done", "doing"],
                "have": ["have", "has", "had", "having"],
                "run": ["run", "runs", "ran", "running"],
                "write": ["write", "writes", "wrote", "written", "writing"],
                "speak": ["speak", "speaks", "spoke", "spoken", "speaking"],
                "break": ["break", "breaks", "broke", "broken", "breaking"],
                "bring": ["bring", "brings", "brought", "bringing"],
                "buy": ["buy", "buys", "bought", "buying"],
                "catch": ["catch", "catches", "caught", "catching"],
                "choose": ["choose", "chooses", "chose", "chosen", "choosing"],
                "feel": ["feel", "feels", "felt", "feeling"],
                "find": ["find", "finds", "found", "finding"],
                "keep": ["keep", "keeps", "kept", "keeping"],
                "know": ["know", "knows", "knew", "known", "knowing"],
                "leave": ["leave", "leaves", "left", "leaving"],
                "lose": ["lose", "loses", "lost", "losing"],
                "pay": ["pay", "pays", "paid", "paying"],
                "put": ["put", "puts", "putting"],
                "read": ["read", "reads", "reading"],
                "see": ["see", "sees", "saw", "seen", "seeing"],
                "send": ["send", "sends", "sent", "sending"],
                "set": ["set", "sets", "setting"],
                "sit": ["sit", "sits", "sat", "sitting"],
                "stand": ["stand", "stands", "stood", "standing"],
                "teach": ["teach", "teaches", "taught", "teaching"],
                "tell": ["tell", "tells", "told", "telling"],
                "think": ["think", "thinks", "thought", "thinking"],
                "understand": ["understand", "understands", "understood", "understanding"]
            };

            const b = String(base || "").toLowerCase();
            if (irregulars[b]) return irregulars[b];

            const forms = new Set([b]);
            if (b.endsWith("e")) {
                forms.add(b + "s");
                forms.add(b.slice(0, -1) + "ed");
                forms.add(b.slice(0, -1) + "ing");
            } else if (b.endsWith("y") && !/[aeiou]y$/.test(b)) {
                forms.add(b.slice(0, -1) + "ies");
                forms.add(b.slice(0, -1) + "ied");
                forms.add(b + "ing");
            } else {
                forms.add(b + "s");
                forms.add(b + "ed");
                forms.add(b + "ing");
            }
            return Array.from(forms);
        }

        function variableNounPhrasePattern(maxWords = 4) {
            // 前置詞や接続詞の手前で止める。例: wash away the problem during... → wash away the problem
            const stop = "in|inside|on|at|by|for|with|during|before|after|to|from|of|as|if|when|while|because|since|until|unless|under|over|through|into|onto|about|within|without|than|that|which|who|where";
            return `(?:[A-Za-z][A-Za-z'’.-]*(?:\\s+(?!${stop}\\b)[A-Za-z][A-Za-z'’.-]*){0,${maxWords - 1}})`;
        }

        function gerundPhrasePattern() {
            // doing の部分を taking photos / solving the issue などに対応させる
            const stop = "in|inside|on|at|by|for|with|during|before|after|to|from|of|as|if|when|while|because|since|until|unless|under|over|through|into|onto|about|within|without|than|that|which|who|where";
            return `(?:[A-Za-z][A-Za-z'’.-]*ing(?:\\s+(?!${stop}\\b)[A-Za-z][A-Za-z'’.-]*){0,3})`;
        }

        function bareVerbPhrasePattern() {
            return `(?:[A-Za-z][A-Za-z'’.-]*(?:\\s+[A-Za-z][A-Za-z'’.-]*){0,3})`;
        }

        function tokenToPattern(token, index, tokens) {
            const t = String(token || "").toLowerCase();
            const prev = index > 0 ? String(tokens[index - 1]).toLowerCase() : "";

            if (["~", "...", "someone", "somebody", "something", "one", "one's", "ones", "oneself", "it"].includes(t)) {
                return variableNounPhrasePattern(4);
            }
            if (["a", "b", "o", "c"].includes(t)) {
                return variableNounPhrasePattern(3);
            }
            if (t === "doing") {
                return gerundPhrasePattern();
            }
            if (t === "do" && prev === "to") {
                return bareVerbPhrasePattern();
            }
            if (t === "be") {
                return `(?:${getVerbForms("be").map(escapeRegExp).join("|")})`;
            }

            const forms = getVerbForms(t).map(escapeRegExp).join("|");
            return `(?:${forms})`;
        }

        function buildPatternFromTokens(tokens) {
            const filtered = [];
            for (let i = 0; i < tokens.length; i++) {
                // doing ~ は doing 側で目的語まで吸収するので、直後の ~ は飛ばす
                if (tokens[i] === "~" && i > 0 && String(tokens[i - 1]).toLowerCase() === "doing") continue;
                filtered.push(tokens[i]);
            }
            if (filtered.length === 0) return null;

            const parts = filtered.map((tok, idx) => tokenToPattern(tok, idx, filtered));
            return `\\b${parts.join("\\s+")}\\b`;
        }

        function buildTargetRegex(targetWord) {
            const normalized = normalizeTargetExpression(targetWord);
            if (!normalized) return null;

            const candidates = new Set([normalized]);

            // be interested in ~ → interested in ~ でも拾えるようにする
            if (/^be\s+/i.test(normalized)) {
                candidates.add(normalized.replace(/^be\s+/i, ""));
            }

            // 「A to B」「A into B」等の記号を緩めるための掃除版
            const cleaned = normalized
                .replace(/[（）()[\]]/g, " ")
                .replace(/[･・]/g, " ")
                .replace(/\s+/g, " ")
                .trim();
            if (cleaned) candidates.add(cleaned);

            const patterns = [];

            candidates.forEach(candidate => {
                const tokens = candidate.split(/\s+/).filter(Boolean);
                const pattern = buildPatternFromTokens(tokens);
                if (pattern) patterns.push(pattern);

                // trailing ~ を持つ熟語は、~なし版でも拾う
                if (tokens[tokens.length - 1] === "~") {
                    const withoutTilde = tokens.slice(0, -1);
                    const p2 = buildPatternFromTokens(withoutTilde);
                    if (p2) patterns.push(p2);
                }
            });

            const uniquePatterns = Array.from(new Set(patterns)).sort((a, b) => b.length - a.length);
            if (uniquePatterns.length === 0) return null;
            return new RegExp(uniquePatterns.join("|"), "gi");
        }

        function renderMaskedPhrase(rawPhrase, targetWord, reveal = false) {
            const phrase = String(rawPhrase || "");
            const regex = buildTargetRegex(targetWord);
            if (!regex) return escapeHtml(phrase);

            let matched = false;
            let lastIndex = 0;
            let html = "";

            phrase.replace(regex, (match, ...args) => {
                const offset = args[args.length - 2];
                matched = true;
                html += escapeHtml(phrase.slice(lastIndex, offset));
                html += reveal
                    ? `<span class="text-rose-500 underline font-black font-mono">${escapeHtml(match)}</span>`
                    : "_____";
                lastIndex = offset + match.length;
                return match;
            });

            if (matched) {
                html += escapeHtml(phrase.slice(lastIndex));
                return html;
            }

            // 最終フォールバック：完全一致だけでも拾う
            const simpleTarget = normalizeTargetExpression(targetWord).replace(/\s*~\s*$/g, "");
            if (simpleTarget) {
                const simpleRegex = new RegExp(escapeRegExp(simpleTarget), "gi");
                lastIndex = 0;
                html = "";
                phrase.replace(simpleRegex, (match, ...args) => {
                    const offset = args[args.length - 2];
                    matched = true;
                    html += escapeHtml(phrase.slice(lastIndex, offset));
                    html += reveal
                        ? `<span class="text-rose-500 underline font-black font-mono">${escapeHtml(match)}</span>`
                        : "_____";
                    lastIndex = offset + match.length;
                    return match;
                });
                if (matched) {
                    html += escapeHtml(phrase.slice(lastIndex));
                    return html;
                }
            }

            return escapeHtml(phrase);
        }


        function showQuestion() {
            if (currentDeck.length === 0 || currentIndex >= currentDeck.length) {
                alert("🎉 セクション内のすべての問題をクリアしました！完璧なコンプリートです！");
                exitQuiz();
                return;
            }

            domQuizAnswerZone.classList.add('invisible');
            domQuizChoicePad.classList.add('hidden');
            domBtnReveal.classList.remove('hidden');

            const currentQuestion = currentDeck[currentIndex];

            // 画面上の残り問題数カウンターをリアルタイム動的表示
            domQuizCount.textContent = currentDeck.length - currentIndex;
            
            const progressPercent = initialUniqueCount > 0 ? (currentIndex / currentDeck.length) * 100 : 0;
            domQuizProgressBar.style.width = `${progressPercent}%`;
            domQuizSectionTitle.textContent = currentQuestion.section;

            domQuizHintMeaning.textContent = currentQuestion.meaning;
            domQuizBoostEtymology.textContent = currentQuestion.etymology || "語源データ最適化済";
            domQuizBoostPreposition.textContent = currentQuestion.note || "（補足なし）";
            domQuizCorrectWord.textContent = currentQuestion.word;

            // ターゲット単語・熟語を隠して「_____」に変える
            // take up ~ → take/takes/took/taken/taking up、be tired of → is/was/are tired of などにも対応
            domQuizPhrase.innerHTML = renderMaskedPhrase(currentQuestion.phrase, currentQuestion.word, false);
        }

        // --- 答えを見る ---
        function revealAnswer() {
            domBtnReveal.classList.add('hidden');
            domQuizChoicePad.classList.remove('hidden');
            domQuizAnswerZone.classList.remove('invisible');

            const currentQuestion = currentDeck[currentIndex];
            domQuizPhrase.innerHTML = renderMaskedPhrase(currentQuestion.phrase, currentQuestion.word, true);

            // ネイティブ発音を即座に自動再生
            speak(currentQuestion.word, 1.0);
        }

        // --- 仕分けシステム（ゲーム作成プロのオートローテーション） ---
        function handleUserJudgment(isCorrect) {
            const currentQuestion = currentDeck[currentIndex];

            if (isCorrect) {
                // 覚えた（クリア）なら保存してリストから除外していく
                if (!clearedList.includes(currentQuestion.id)) {
                    clearedList.push(currentQuestion.id);
                    localStorage.setItem(storageKey, JSON.stringify(clearedList));
                }
                comboCount++;
                updateComboUI();
                currentIndex++;
            } else {
                // もう一度（復習）なら、現在のデッキの最後尾にガサッと回す（無限ローテーション）
                comboCount = 0; 
                updateComboUI();

                currentDeck.push(currentQuestion);
                currentIndex++;
            }

            showQuestion();
        }

        function updateComboUI() {
            if (comboCount >= 3) {
                domQuizComboBadge.classList.remove('opacity-0');
                domQuizComboCount.textContent = comboCount;
                domHeaderCombo.classList.remove('hidden');
                domHeaderComboCount.textContent = comboCount;
            } else {
                domQuizComboBadge.classList.add('opacity-0');
                domHeaderCombo.classList.add('hidden');
            }
        }

        function exitQuiz() {
            renderHome();
        }

        function resetSectionProgress(sectionName) {
            if (confirm(`${sectionName} のクリア記録をリセットして未着手に戻しますか？`)) {
                const targetIds = MASTER_DATA.filter(item => item.section === sectionName).map(item => item.id);
                clearedList = clearedList.filter(id => !targetIds.includes(id));
                localStorage.setItem(storageKey, JSON.stringify(clearedList));
                renderHome();
            }
        }

        domBtnResetAll.addEventListener('click', () => {
            if (confirm("すべての進捗データを完全に消去し、初期状態に戻しますか？")) {
                clearedList = [];
                localStorage.removeItem(storageKey);
                renderHome();
            }
        });

        function speak(text, speed = 1.0) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let cleanText = text.replace(/_____/g, "blank");
                const utterance = new SpeechSynthesisUtterance(cleanText);
                utterance.lang = 'en-US';
                utterance.rate = speed;
                window.speechSynthesis.speak(utterance);
            }
        }

        // イベントリスナー
        domBtnReveal.addEventListener('click', revealAnswer);
        domBtnCorrect.addEventListener('click', () => handleUserJudgment(true));
        domBtnWrong.addEventListener('click', () => handleUserJudgment(false));
        domBtnBack.addEventListener('click', () => {
            if (confirm("ホームに戻りますか？現在のセッション状態は一度リセットされます。")) { exitQuiz(); }
        });
        domBtnSpeakWord.addEventListener('click', () => { speak(currentDeck[currentIndex - 1]?.word || currentDeck[currentIndex].word, 1.0); });
        domBtnSpeakPhrase.addEventListener('click', () => { speak(currentDeck[currentIndex - 1]?.phrase || currentDeck[currentIndex].phrase, 0.95); });

        // 初期実行
        renderHome();
    </script>
</body>
</html>
