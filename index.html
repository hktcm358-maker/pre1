<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ 英単語ハックマスター準1級 ⚡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .progress-bar {
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .fade-in {
            animation: fadeIn 0.2s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between antialiased selection:bg-blue-500/30">

    <header class="w-full glass-card border-b border-slate-800 px-4 py-3 sticky top-0 z-50 flex items-center justify-between">
        <div class="flex items-center space-x-2">
            <span class="text-xl">⚡</span>
            <h1 class="text-base font-bold tracking-wider text-blue-400">WORD HACKER</h1>
        </div>
        <div id="header-combo" class="hidden bg-gradient-to-r from-amber-500 to-orange-500 text-slate-950 font-black px-2.5 py-0.5 rounded-full text-xs tracking-wider">
            🔥 <span id="header-combo-count">0</span> COMBO
        </div>
    </header>

    <main class="flex-1 w-full max-w-md mx-auto p-4 flex flex-col justify-start">

        <div id="screen-home" class="space-y-5 w-full fade-in">
            <div class="text-center py-2">
                <p class="text-xs text-slate-400 uppercase tracking-widest">Target Acquired</p>
                <h2 id="home-title" class="text-xl font-black text-slate-100 mt-1">英単語ハックマスター</h2>
                <p class="text-xs text-emerald-400 mt-1">🎯 隙間時間ハック ＆ コンプリート仕様</p>
            </div>

            <div class="glass-card rounded-2xl p-4 border border-blue-500/20 bg-gradient-to-br from-blue-950/30 to-slate-900/50">
                <div class="flex justify-between text-xs text-slate-400 mb-1">
                    <span>👑 総コンプリート率（覚えた単語）</span>
                    <span id="total-progress-percent" class="font-bold text-blue-400">0%</span>
                </div>
                <div class="w-full bg-slate-800 h-3 rounded-full overflow-hidden p-[1px]">
                    <div id="total-progress-bar" class="progress-bar bg-gradient-to-r from-emerald-400 via-teal-500 to-blue-500 h-full w-0 rounded-full"></div>
                </div>
                <div class="flex justify-between text-[10px] text-slate-500 mt-1.5 font-mono">
                    <span id="total-progress-count">マスター: 0 / 0 語</span>
                    <button id="btn-reset-all" class="text-rose-400/70 hover:text-rose-400 transition-colors">データ全消去</button>
                </div>
            </div>

            <div id="section-list" class="space-y-3 max-h-[55vh] overflow-y-auto pr-1">
                </div>
        </div>

        <div id="screen-quiz" class="hidden space-y-4 w-full flex-1 flex flex-col justify-between fade-in">
            
            <div class="flex items-center justify-between">
                <button id="btn-back" class="text-xs font-bold text-slate-400 hover:text-slate-200 flex items-center space-x-1 py-1 px-2.5 rounded-lg bg-slate-800/60 transition-colors">
                    <span>↩ ホームへ戻る</span>
                </button>
                <div class="text-xs font-mono tracking-wider bg-slate-800/80 px-3 py-1 rounded-md text-slate-300 border border-slate-700/50">
                    現在の残り: <span id="quiz-count" class="font-bold text-amber-400 text-sm">0</span> 問
                </div>
            </div>

            <div class="space-y-1">
                <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                    <div id="quiz-progress-bar" class="progress-bar bg-gradient-to-r from-blue-500 to-indigo-500 h-full w-0"></div>
                </div>
                <div class="flex justify-between items-center px-0.5">
                    <span id="quiz-combo-badge" class="opacity-0 text-[10px] font-bold bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30 transition-all">
                        🔥 <span id="quiz-combo-count">0</span> COMBO
                    </span>
                    <span id="quiz-section-title" class="text-[10px] text-slate-500 uppercase tracking-wider font-bold"></span>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-5 border border-slate-700/60 bg-gradient-to-b from-slate-800/40 to-slate-900/60 flex-1 flex flex-col justify-between shadow-xl min-h-[360px]">
                
                <div class="space-y-3">
                    <div class="space-y-1">
                        <span class="text-[10px] uppercase font-bold tracking-widest text-slate-500 block">日本語訳・ヒント</span>
                        <div class="text-slate-100 font-bold text-base leading-snug" id="quiz-hint-meaning"></div>
                    </div>

                    <div id="quiz-memory-booster" class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800/80 text-[11px]">
                        <div class="bg-slate-950/40 p-2 rounded-lg border border-slate-800/30">
                            <span class="text-[9px] font-bold text-blue-400 block">💡 語源・単語イメージ</span>
                            <span id="quiz-boost-etymology" class="text-slate-300 font-medium"></span>
                        </div>
                        <div class="bg-slate-950/40 p-2 rounded-lg border border-slate-800/30">
                            <span class="text-[9px] font-bold text-indigo-400 block">🔗 補足・コロケーション</span>
                            <span id="quiz-boost-preposition" class="text-slate-300 font-medium"></span>
                        </div>
                    </div>
                </div>

                <div class="py-4 my-auto text-center">
                    <p class="text-[10px] uppercase font-bold tracking-widest text-slate-500 mb-1.5">ENGLISH PHRASE</p>
                    <div id="quiz-phrase" class="text-lg md:text-xl font-bold text-slate-100 leading-relaxed tracking-wide transition-all"></div>
                </div>

                <div id="quiz-answer-zone" class="invisible py-3 text-center border-t border-slate-800/60 bg-slate-950/30 rounded-xl space-y-2">
                    <p class="text-[10px] uppercase font-bold tracking-widest text-emerald-400">CORRECT WORD</p>
                    <div id="quiz-correct-word" class="text-2xl font-black tracking-wider text-emerald-400 select-all"></div>
                    
                    <div class="flex justify-center space-x-2 pt-1">
                        <button id="btn-speak-word" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1 rounded-lg border border-slate-700 flex items-center space-x-1 active:scale-95 transition-transform">
                            <span>🔊 単語</span>
                        </button>
                        <button id="btn-speak-phrase" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1 rounded-lg border border-slate-700 flex items-center space-x-1 active:scale-95 transition-transform">
                            <span>🔊 フレーズ</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-full pt-2">
                <button id="btn-reveal" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-4 rounded-xl shadow-lg shadow-blue-500/20 active:scale-[0.99] transition-transform text-sm tracking-widest">
                    👁 答えを見る (TAP TO REVEAL)
                </button>

                <div id="quiz-choice-pad" class="hidden grid grid-cols-2 gap-3.5">
                    <button id="btn-wrong" class="bg-gradient-to-b from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-bold py-4 rounded-xl shadow-md active:scale-[0.97] transition-all flex flex-col items-center justify-center">
                        <span class="text-base flex items-center space-x-1">❌ <span>もう一度（復習）</span></span>
                        <span class="text-[9px] opacity-75 font-normal mt-0.5">列の最後尾へ自動ローテーション</span>
                    </button>
                    <button id="btn-correct" class="bg-gradient-to-b from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 text-white font-bold py-4 rounded-xl shadow-md active:scale-[0.97] transition-all flex flex-col items-center justify-center">
                        <span class="text-base flex items-center space-x-1">⭕ <span>覚えた（クリア）</span></span>
                        <span class="text-[9px] opacity-75 font-normal mt-0.5">マスターリストへ完全保存 ✨</span>
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full text-center py-2 text-[9px] text-slate-600 border-t border-slate-900 bg-slate-950/40">
        &copy; 2026 Word Hacker System. Optimized for Capricorn Gamers.
    </footer>

    <script>
        
        const MASTER_DATA = [{"id":1,"section":"Section 1 (準1級)","word":"last","phrase":"The conference may last for three days if every panel is held as planned.","meaning":"続く、持続する、(天候・体力・食品などが)持ちこたえる","note":"『最後の』だけでなく、動詞で『続く・持ちこたえる』。\n\n【例文訳】\nすべての討論会が予定通り行われれば、その会議は3日間続くかもしれない。","etymology":"","preposition":""},{"id":2,"section":"Section 1 (準1級)","word":"affect","phrase":"Climate change can affect food production in many regions.","meaning":"に影響を及ぼす；を感動させる","note":"【例文訳】\n気候変動は多くの地域で食料生産に影響を及ぼす可能性がある。","etymology":"","preposition":""},{"id":3,"section":"Section 1 (準1級)","word":"claim","phrase":"The scientist claims that the new method is both cheaper and safer.","meaning":"と主張する；を(自分のものとして)要求する\n主張するだけでなく、権利として要求する、災害・事故が命を奪うという意味もある。","note":"【例文訳】その科学者は、新しい方法はより安く、より安全だと主張している。","etymology":"clam は『叫ぶ』。声に出して主張・要求するイメージ。","preposition":""},{"id":4,"section":"Section 1 (準1級)","word":"ship","phrase":"The company will ship the medical supplies to remote villages by Friday.","meaning":"を出荷する、を輸送する","note":"船に限らず、商品を出荷・発送する意味で広く使う。\n\n【例文訳】\nその会社は金曜日までに医療物資を遠隔地の村へ輸送する予定だ。","etymology":"","preposition":""},{"id":5,"section":"Section 1 (準1級)","word":"issue","phrase":"Water shortage has become a serious issue in many dry areas.","meaning":"問題(点)；発行(物)；発表","note":"問題点、発行物、発表。動詞では発行する・公布する。\n\n【例文訳】\n水不足は多くの乾燥地域で深刻な問題になっている。","etymology":"","preposition":""},{"id":6,"section":"Section 1 (準1級)","word":"purchase","phrase":"The city plans to purchase electric buses to reduce emissions.","meaning":"を購入する","note":"【例文訳】\n市は排出量を減らすために電気バスを購入する予定だ。","etymology":"古くは『追い求めて得る』感覚。単なる buy より正式・書き言葉寄り。","preposition":""},{"id":7,"section":"Section 1 (準1級)","word":"occur","phrase":"Minor errors may occur when the data is copied by hand.","meaning":"起こる；心に浮かぶ；現れる","note":"起こる。occur to 人 で『人の心に浮かぶ』。\n\n【例文訳】\nデータを手作業で写すと小さな誤りが起こることがある。","etymology":"ob-（向かって）+ cur（走る）。出来事や考えがこちらへ走って来る→起こる/思い浮かぶ。","preposition":""},{"id":8,"section":"Section 1 (準1級)","word":"deal","phrase":"Local officials must deal with the growing demand for public housing.","meaning":"を処理する；を商う；を分配する","note":"deal with は『扱う・対処する』。名詞では取引・量・契約。\n\n【例文訳】\n地方当局は公営住宅への高まる需要に対処しなければならない。","etymology":"","preposition":""},{"id":9,"section":"Section 1 (準1級)","word":"consume","phrase":"Modern households consume far more electricity than those in the past.","meaning":"を消費する；を食べる，飲む","note":"消費するだけでなく、食べる・飲む、感情が人をのみ込む意味もある。\n\n【例文訳】\n現代の家庭は昔の家庭よりはるかに多くの電気を消費する。","etymology":"co-/com-/con- は『共に・一緒に』、または強調。","preposition":""},{"id":10,"section":"Section 1 (準1級)","word":"present","phrase":"The team will present its findings at an international conference.","meaning":"を提示する、を進呈する；出席している；現在の","note":"提示する・発表する・贈呈する。形容詞では『出席している／現在の』。\n\n【例文訳】\nそのチームは国際会議で研究結果を発表する予定だ。","etymology":"pre- は『前もって・前に』。","preposition":""},{"id":11,"section":"Section 1 (準1級)","word":"fire","phrase":"The company decided to fire the manager after the scandal became public.","meaning":"を解雇する、を首にする","note":"【例文訳】\n不祥事が公になった後、その会社はその管理職を解雇することを決めた。","etymology":"","preposition":""},{"id":12,"section":"Section 1 (準1級)","word":"regard","phrase":"Many teachers regard curiosity as more important than quick answers.","meaning":"を見なす；を見る；を評価する","note":"regard A as B＝AをBとみなす。regards は手紙の結びにも使う。\n\n【例文訳】\n多くの教師は、すぐ答えを出すことよりも好奇心の方が重要だと考えている。","etymology":"re- は『再び・後ろへ』。元に戻す/繰り返す感覚。","preposition":""},{"id":13,"section":"Section 1 (準1級)","word":"fine","phrase":"Drivers may be fined for parking in front of a fire station.","meaning":"に罰金を科す","note":"形容詞の『細かい・見事な・晴れた』とは別に、動詞では『罰金を科す』。\n\n【例文訳】\n消防署の前に駐車すると、運転者は罰金を科されることがある。","etymology":"","preposition":""},{"id":14,"section":"Section 1 (準1級)","word":"transfer","phrase":"She transferred the photos from her old phone to her new laptop.","meaning":"を移す；を伝える；移る；乗り換える","note":"物・人・権利・データを移す。自動詞では乗り換える・転勤/転校する。\n\n【例文訳】\n彼女は古いスマホから新しいノートパソコンへ写真を移した。","etymology":"trans-（越えて）+ fer（運ぶ）。境界を越えて運ぶ→移す・乗り換える。","preposition":""},{"id":15,"section":"Section 1 (準1級)","word":"decline","phrase":"A similar problem may decline when the system is used under pressure.","meaning":"減少する；衰退する；を断る","note":"【例文訳】\nその仕組みが負荷の下で使われると、同様の問題が減少することがある。","etymology":"de- は『下へ・離れて・取り除く』。否定だけで覚えない。","preposition":""},{"id":16,"section":"Section 1 (準1級)","word":"eliminate","phrase":"The policy aims to eliminate people who cannot easily access medical care.","meaning":"を取り除く","note":"【例文訳】\nその政策は医療を受けにくい人々を取り除くことを目的としている。","etymology":"min は『小さい』。minor/minimize など。","preposition":""},{"id":17,"section":"Section 1 (準1級)","word":"indicate","phrase":"A simple checklist can help workers indicate mistakes.","meaning":"を指し示す；を述べる","note":"【例文訳】\n簡単なチェックリストは作業員がミスを指し示すのに役立つ。","etymology":"in- は『中へ』または『否定』。文脈・語源で見分ける。","preposition":""},{"id":18,"section":"Section 1 (準1級)","word":"ensure","phrase":"Regular backups ensure that important files are not lost.","meaning":"を確実にする(≒ make sure)；を守る","note":"【例文訳】\n定期的なバックアップは、重要なファイルが失われないようにしてくれる。","etymology":"","preposition":""},{"id":19,"section":"Section 1 (準1級)","word":"expand","phrase":"Officials must expand the results clearly to avoid confusion.","meaning":"(を)拡大する；(を)詳説する","note":"【例文訳】\n当局者は混乱を避けるために結果を明確に拡大する必要がある。","etymology":"ex-（外へ）+ pand（広げる）。内側から外へ広がる。","preposition":""},{"id":20,"section":"Section 1 (準1級)","word":"address","phrase":"The principal promised to address bullying more seriously.","meaning":"(問題など)に対処する；に演説する；(手紙など)を(～宛てに)出す(to)","note":"【例文訳】\n校長は、いじめにもっと真剣に対処すると約束した。\n住所だけでなく、問題に取り組む、演説する、人に呼びかける意味が頻出。","etymology":"ad-（〜へ）+ direct（まっすぐ）。相手・問題へまっすぐ向かう。","preposition":""},{"id":21,"section":"Section 1 (準1級)","word":"identify","phrase":"Researchers worked to identify the source of the contamination.","meaning":"を特定する；を(～と)同一視する(with)","note":"【例文訳】研究者たちは汚染の原因を特定しようと取り組んだ。","etymology":"","preposition":""},{"id":22,"section":"Section 1 (準1級)","word":"construct","phrase":"The company plans to construct a new research center next year.","meaning":"を建設する(＝ build)；を構成する","note":"【例文訳】その会社は来年、新しい研究センターを建設する予定だ。","etymology":"struct は『積み上げる・作る』。construct/destruct/instruct など。","preposition":""},{"id":23,"section":"Section 1 (準1級)","word":"invest","phrase":"The company plans to invest heavily in renewable energy.","meaning":"(を)投資する；に(～を)与える(with)","note":"【例文訳】その会社は再生可能エネルギーに多額の投資をする予定だ。","etymology":"in- は『中へ』または『否定』。文脈・語源で見分ける。","preposition":""},{"id":24,"section":"Section 1 (準1級)","word":"obtain","phrase":"Students must obtain permission before using the laboratory after hours.","meaning":"を得る","note":"【例文訳】学生は時間外に実験室を使う前に許可を得なければならない。","etymology":"","preposition":""},{"id":25,"section":"Section 1 (準1級)","word":"struggle","phrase":"Finding affordable housing has become a daily struggle for many families.","meaning":"闘い；懸命の努力","note":"【例文訳】手頃な価格の家を見つけることは、多くの家庭にとって日々の苦闘になっている。","etymology":"","preposition":""},{"id":26,"section":"Section 1 (準1級)","word":"counter","phrase":"The lawyer tried to counter the accusation with new evidence.","meaning":"〜と反論する、〜に反対する","note":"【例文訳】弁護士は新たな証拠でその非難に反論しようとした。","etymology":"co-/com-/con- は『共に・一緒に』、または強調。","preposition":""},{"id":27,"section":"Section 1 (準1級)","word":"associate","phrase":"New evidence may associate how the accident happened.","meaning":"を結び付けて考える；(～と)交際する(with)","note":"【例文訳】新たな証拠がその事故がどのように起きたかを結び付けて考えられるかもしれない。","etymology":"","preposition":""},{"id":28,"section":"Section 1 (準1級)","word":"register","phrase":"The team managed to register the project despite a tight schedule.","meaning":"を記録する，登録する；(～に)登録する(for)","note":"【例文訳】そのチームは厳しい日程にもかかわらず、その計画を登録することができた。","etymology":"re- は『再び・後ろへ』。元に戻す/繰り返す感覚。","preposition":""},{"id":29,"section":"Section 1 (準1級)","word":"reveal","phrase":"The city decided to reveal old rules after residents complained.","meaning":"を明らかにする；を見せる","note":"【例文訳】市は住民の苦情を受けて古い規則を明らかにすることを決めた。","etymology":"re- は『再び・後ろへ』。元に戻す/繰り返す感覚。","preposition":""},{"id":30,"section":"Section 1 (準1級)","word":"species","phrase":"Several rare species live only in this small forest.","meaning":"(生物の)種；種類","note":"【例文訳】い "},{"id":1548,"section":"Section 16 (準1級)","word":"tumble","phrase":"He tripped and began to tumble down the hill.","meaning":"転倒、(株価などの)暴落","note":"【例文訳】彼はつまずいて丘を転げ落ち始めた。","etymology":"","preposition":""},{"id":1549,"section":"Section 16 (準1級)","word":"diameter","phrase":"We calculated the diameter of the circle.","meaning":"直径","note":"【例文訳】私たちは円の直径を計算した。","etymology":"","preposition":""},{"id":1550,"section":"Section 16 (準1級)","word":"momentum","phrase":"The project gained momentum after the first success.","meaning":"勢い、はずみ","note":"【例文訳】そのプロジェクトは最初の成功後、勢いを増した。","etymology":"","preposition":""},{"id":1551,"section":"Section 16 (準1級)","word":"troop","phrase":"The troops marched across the field.","meaning":"軍隊、兵隊","note":"【例文訳】軍隊は野原を行進した。","etymology":"","preposition":""},{"id":1552,"section":"Section 16 (準1級)","word":"pharmacy","phrase":"She went to the pharmacy to pick up her medicine.","meaning":"薬屋、薬局","note":"【例文訳】彼女は薬を受け取るために薬局へ行った。","etymology":"","preposition":""},{"id":1553,"section":"Section 16 (準1級)","word":"nightmare","phrase":"He woke up from a terrible nightmare.","meaning":"悪夢、(悪夢のような)恐ろしい経験","note":"【例文訳】彼はひどい悪夢から目覚めた。","etymology":"","preposition":""},{"id":1554,"section":"Section 16 (準1級)","word":"slope","phrase":"The slope of the hill made climbing difficult.","meaning":"坂、斜面","note":"【例文訳】その丘の傾斜は登るのを難しくした。","etymology":"","preposition":""},{"id":1555,"section":"Section 16 (準1級)","word":"glacier","phrase":"The glacier has been melting rapidly in recent years.","meaning":"氷河","note":"【例文訳】その氷河は近年急速に溶けている。","etymology":"","preposition":""},{"id":1556,"section":"Section 16 (準1級)","word":"grief","phrase":"She was overwhelmed with grief after the loss.","meaning":"(死などに対する)深い悲しみ、悲痛","note":"【例文訳】彼女はその喪失に深い悲しみに打ちひしがれた。","etymology":"","preposition":""},{"id":1557,"section":"Section 16 (準1級)","word":"misery","phrase":"Living in constant misery affects mental health.","meaning":"惨めさ、悲惨さ","note":"【例文訳】絶え間ない苦悩の中で暮らすことは精神に影響を与える。","etymology":"","preposition":""},{"id":1558,"section":"Section 16 (準1級)","word":"accent","phrase":"He speaks English with a slight accent.","meaning":"なまり、方言","note":"【例文訳】彼はわずかなアクセントで英語を話す。","etymology":"","preposition":""},{"id":1559,"section":"Section 16 (準1級)","word":"ambassador","phrase":"The ambassador met with foreign leaders.","meaning":"大使","note":"【例文訳】大使は外国の指導者と会談した。","etymology":"","preposition":""},{"id":1560,"section":"Section 16 (準1級)","word":"autopsy","phrase":"The autopsy revealed the cause of death.","meaning":"検死","note":"【例文訳】検死で死因が明らかになった。","etymology":"","preposition":""},{"id":1561,"section":"Section 16 (準1級)","word":"blast","phrase":"The blast from the explosion shook the entire building.","meaning":"爆発、爆破、突風","note":"【例文訳】爆発の衝撃で建物全体が揺れた。","etymology":"","preposition":""},{"id":1562,"section":"Section 16 (準1級)","word":"courtesy","phrase":"She showed courtesy by holding the door open.","meaning":"礼儀正しさ；好意；優遇","note":"【例文訳】彼女はドアを開けて待つという礼儀を示した。","etymology":"co-/com-/con- は『共に・一緒に』、または強調。","preposition":""},{"id":1563,"section":"Section 16 (準1級)","word":"deed","phrase":"He was proud of his good deed.","meaning":"(意図的な)行為、行い","note":"【例文訳】彼は自分の善行を誇りに思った。","etymology":"","preposition":""},{"id":1564,"section":"Section 16 (準1級)","word":"discourse","phrase":"The professor gave a long discourse on ethics.","meaning":"話し合い，会話；講演；論説","note":"【例文訳】教授は倫理について長い講義を行った。","etymology":"dis- は『離す・反対・否定』。","preposition":""},{"id":1565,"section":"Section 16 (準1級)","word":"impulse","phrase":"He acted on impulse and bought the item.","meaning":"衝動","note":"【例文訳】彼は衝動的にその品物を買った。","etymology":"in-/im- は『中へ』または『否定』。後ろの音で形が変わる。","preposition":""},{"id":1566,"section":"Section 16 (準1級)","word":"jar","phrase":"The jar broke when it fell off the shelf.","meaning":"(広口の)びん、つぼ","note":"【例文訳】その瓶は棚から落ちて割れた。","etymology":"","preposition":""},{"id":1567,"section":"Section 16 (準1級)","word":"sibling","phrase":"She has three siblings who live abroad.","meaning":"兄弟姉妹(の１人)","note":"【例文訳】彼女には海外に住む兄弟姉妹が3人い ":"Section 16 (準1級)","word":"deceptive","phrase":"The advertisement was deceptive and misleading.","meaning":"人を惑わすような","note":"【例文訳】その広告は欺瞞的で誤解を招いた。","etymology":"cept/cap/ceive は『つかむ・取る』。","preposition":""},{"id":1578,"section":"Section 16 (準1級)","word":"illogical","phrase":"His argument was illogical and confusing.","meaning":"筋の通らない、不合理な","note":"【例文訳】彼の主張は非論理的で混乱していた。","etymology":"log は『言葉・理屈』。dialogue/logic など。","preposition":""},{"id":1579,"section":"Section 16 (準1級)","word":"elaborate","phrase":"They created an elaborate plan for the event.","meaning":"精巧な、入念な","note":"【例文訳】彼らはイベントのために手の込んだ計画を立てた。","etymology":"","preposition":""},{"id":1580,"section":"Section 16 (準1級)","word":"mellow","phrase":"The music had a mellow and relaxing tone.","meaning":"(性格が)円熟した、柔らかくて豊かな[美しい]","note":"【例文訳】その音楽はまろやかでリラックスできる雰囲気だった。","etymology":"","preposition":""},{"id":1581,"section":"Section 16 (準1級)","word":"boundless","phrase":"She felt boundless joy when she saw the results.","meaning":"無限の","note":"【例文訳】彼女は結果を見て限りない喜びを感じた。","etymology":"","preposition":""},{"id":1582,"section":"Section 16 (準1級)","word":"cordial","phrase":"He greeted us with a cordial smile.","meaning":"心温まる、心からの","note":"【例文訳】彼は温かい笑顔で私たちに挨拶した。","etymology":"co-/com-/con- は『共に・一緒に』、または強調。","preposition":""},{"id":1583,"section":"Section 16 (準1級)","word":"seasonal","phrase":"Seasonal fruits are fresher and tastier.","meaning":"季節(ごと)の","note":"【例文訳】季節の果物はより新鮮でおいしい。","etymology":"","preposition":""},{"id":1584,"section":"Section 16 (準1級)","word":"sour","phrase":"The lemon tasted extremely sour.","meaning":"酸っぱい","note":"【例文訳】そのレモンは非常に酸っぱかった。","etymology":"","preposition":""},{"id":1585,"section":"Section 16 (準1級)","word":"swift","phrase":"He made a swift decision in the emergency.","meaning":"素早い","note":"【例文訳】彼は緊急時に素早い決断を下した。","etymology":"","preposition":""},{"id":1586,"section":"Section 16 (準1級)","word":"cumulative","phrase":"The cumulative effect of stress can be harmful.","meaning":"累積する、しだいに増加する","not "bold","phrase":"She made a bold choice to change careers.","meaning":"大胆な、勇敢な","note":"【例文訳】彼女は大胆にもキャリアを変える選択をした。","etymology":"","preposition":""},{"id":1597,"section":"Section 16 (準1級)","word":"pessimistic","phrase":"He tends to be pessimistic about the future.","meaning":"悲観的な","note":"【例文訳】彼は将来について悲観的になりがちだ。","etymology":"","preposition":""},{"id":1598,"section":"Section 16 (準1級)","word":"repetitive","phrase":"The task became repetitive and boring.","meaning":"繰り返しの","note":"【例文訳】その作業は繰り返しで退屈になった。","etymology":"re- は『再び・後ろへ』。元に戻す/繰り返す感覚。","preposition":""},{"id":1599,"section":"Section 16 (準1級)","word":"respiratory","phrase":"Smoking can cause respiratory problems.","meaning":"呼吸器に関する、呼吸の","note":"【例文訳】喫煙は呼吸器の問題を引き起こす可能性がある。","etymology":"re- は『再び・後ろへ』。元に戻す/繰り返す感覚。","preposition":""},{"id":1600,"section":"Section 16 (準1級)","word":"coherent","phrase":"Her explanation was clear and coherent.","meaning":"一貫した，筋の通った；結束した","note":"【例文訳】彼女の説明は明確で首尾一貫していた。","etymology":"co-/com-/con- は『共に・一緒に』、または強調。","preposition":""},{"id":1601,"section":"Section 17 (準1級)","word":"account for ~","phrase":"His explanation helped account for the missing data.","meaning":"(割合・分量など)を占める、〜(の理由)を説明する","note":"【例文訳】彼の説明は欠けていたデータを説明する助けになった。","etymology":"","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1602,"section":"Section 17 (準1級)","word":"accuse A of B","phrase":"They accused him of stealing the documents.","meaning":"AをBの罪で告訴する、AをBの理由で非難する","note":"【例文訳】彼らは彼を書類を盗んだとして非難した。","etymology":"","preposition":"of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。"},{"id":1603,"section":"Section 17 (準1級)","word":"act on ~","phrase":"We must act on the information immediately.","meaning":"(忠告・情報など)に従って行動する、〜に影響を及ぼす","note":"【例文訳】私たちはその情報に基づいてすぐ行動しなければならない。","etymology":"","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1604,"section":"Section 17 (準1級)","word":"act out ~","phrase":"The children acted out the story in class.","meaning":"(物語・経験など)を身振りで実演する","note":"【例文訳】子どもたちは授業でその物語を演じた 、丸暗記より崩れにくい。"},{"id":1613,"section":"Section 17 (準1級)","word":"back down","phrase":"They refused to back down during the debate.","meaning":"撤回する、敗北[非]を認める","note":"【例文訳】彼らは議論の中で引き下がることを拒んだ。","etymology":"","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1614,"section":"Section 17 (準1級)","word":"back off","phrase":"The dog backed off when it saw the cat.","meaning":"手を引く、撤回する、後退する","note":"【例文訳】犬は猫を見ると後ずさりした。","etymology":"","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1615,"section":"Section 17 (準1級)","word":"back up ~","phrase":"I will back up the files on my computer.","meaning":"〜を裏付ける、〜を支援する、(ファイルなど)のコピーを取る","note":"【例文訳】私はコンピューターのファイルをバックアップする。","etymology":"","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1616,"section":"Section 17 (準1級)","word":"back on ~","phrase":"We can back on his support during tough times.","meaning":"〜を当てにする","note":"【例文訳】困難な時でも彼の支援を当てにできる。","etymology":"","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1617,"section":"Section 17 (準1級)","word":"be committed to ~","phrase":"She is committed to improving her skills.","meaning":"〜に献身している","note":"【例文訳】彼女は自分の技能向上に専念している。","etymology":"","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1618,"section":"Section 17 (準1級)","word":"be destined to do ~","phrase":"He is destined to become a great musician.","meaning":"〜する運命である","note":"【例文訳】彼は偉大な音楽家になる運命にある。","etymology":"","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1619,"section":"Section 17 (準1級)","word":"(be) free of ~","phrase":"The water here is free of harmful chemicals.","meaning":"(料金・税金など)がない、〜免除されている","note":"【例文訳】ここの水は有害な化学物質を含まない。","etymology":"","preposition":"of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。"},{"id":1620,"section":"Section 17 (準1級)","word":"be obsessed with ~","phrase":"She is obsessed with collecting rare books.","meaning":"(妄想・固定観念など)に取りつかれている","note":"【例文訳】彼女は珍しい本を集めることに夢中だ。","etymology":"","preposition":"with は『一緒に/伴って』。道具・相手・付帯状況を表す。"},{"id":1621,"section": n 17 (準1級)","word":"break out","phrase":"A fire broke out in the warehouse.","meaning":"勃発する、(伝染病などが)発生する","note":"【例文訳】倉庫で火事が発生した。","etymology":"","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1630,"section":"Section 17 (準1級)","word":"bring about ~","phrase":"The new policy will bring about major improvements.","meaning":"〜を引き起こす、〜を招く","note":"【例文訳】新しい方針は大きな改善をもたらすだろう。","etymology":"","preposition":"about＝周辺に動きを起こす。結果をもたらす。"},{"id":1631,"section":"Section 17 (準1級)","word":"bring down ~","phrase":"The scandal brought down the politician.","meaning":"(人・政府など)を(打ち)倒す","note":"【例文訳】そのスキャンダルは政治家を失脚させた。","etymology":"","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1632,"section":"Section 17 (準1級)","word":"bring off ~","phrase":"She managed to bring off a difficult performance.","meaning":"〜をやってのける、〜を成し遂げる","note":"【例文訳】彼女は難しい演技をやり遂げた。","etymology":"","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1633,"section":"Section 17 (準1級)","word":"bring on ~","phrase":"Stress can bring on headaches.","meaning":"(災い・病気など)をもたらす","note":"【例文訳】ストレスは頭痛を引き起こすことがある。","etymology":"","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1634,"section":"Section 17 (準1級)","word":"bring out ~","phrase":"The company will bring out a new product next month.","meaning":"(才能・性質など)を引き出す、〜を発揮させる","note":"【例文訳】会社は来月新製品を発売する。","etymology":"","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1635,"section":"Section 17 (準1級)","word":"bump into ~","phrase":"I bumped into an old friend at the station.","meaning":"〜にばったり出会う","note":"【例文訳】私は駅で旧友にばったり会った。","etymology":"","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1636,"section":"Section 17 (準1級)","word":"burn out ~","phrase":"The engine burned out after years of use.","meaning":"(人)を疲れ果てさせる、〜を燃え尽きさせる","note":"【例文訳】そのエンジンは長年の使用で焼き切れた。","etymology":"","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1637,"section":"Section 17 (準1級)","word":"by means of ~","phrase":"They solved the problem by means of a new technique.","meaning":"〜用いて、〜によって","note":"【例文訳】彼らは新しい技術によって問題を解決した。","etymology":"","preposition":"of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。 / by は『そば』から『手段・行為者・期限』へ広がる。"},{"id":1638,"section":"Section 17 (準1級)","word":"call for ~","phrase":"The situation calls for immediate action.","meaning":"〜を必要とする、〜を要求する","note":"【例文訳】その状況は即時の対応を必要としている。","etymology":"","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1639,"section":"Section 17 (準1級)","word":"call off ~","phrase":"They decided to call off the meeting.","meaning":"〜を中止する","note":"【例文訳】彼らは会議を中止することにした。","etymology":"","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1640,"section":"Section 17 (準1級)","word":"call on ~","phrase":"The teacher called on several students to answer.","meaning":"〜を訪ねる、(人)に頼む","note":"【例文訳】先生は数人の生徒を指名して答えさせた。","etymology":"","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1641,"section":"Section 17 (準1級)","word":"carry away ~","phrase":"The music carried her away with emotion.","meaning":"無我夢中になる、〜を持ち去る","note":"【例文訳】その音楽は彼女を感情で夢中にさせた。","etymology":"","preposition":"away は『離れて』。"},{"id":1642,"section":"Section 17 (準1級)","word":"carry through ~","phrase":"His determination carried him through the difficult task.","meaning":"〜を成し遂げる、〜を成就させる","note":"【例文訳】彼の決意は困難な仕事をやり遂げさせた。","etymology":"","preposition":"through は『通り抜ける』。過程を最後まで抜ける感覚。"},{"id":1643,"section":"Section 17 (準1級)","word":"catch up on ~","phrase":"I need to catch up on my homework.","meaning":"(近況など)について新しい情報を知る、〜の遅れを取り戻す","note":"【例文訳】宿題の遅れを取り戻す必要がある。","etymology":"","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。 / up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1644,"section":"Section 17 (準1級)","word":"check off ~","phrase":"Let’s check off the items on the list.","meaning":"〜にチェックマークをつける","note":"【例文訳】リストの項目をチェックしていこう。","etymology":"","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1645,"section":"Section 17 (準1級)","word":"chip in ~","phrase":"Everyone chipped in to buy a gift.","meani ology":"","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。 / with は『一緒に/伴って』。道具・相手・付帯状況を表す。"},{"id":1654,"section":"Section 17 (準1級)","word":"come into ~","phrase":"She came into a large inheritance.","meaning":"〜の状態になる","note":"【例文訳】彼女は多額の遺産を受け継いだ。","etymology":"","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1655,"section":"Section 17 (準1級)","word":"come off","phrase":"The plan didn’t come off as expected.","meaning":"結局〜になる、行われる","note":"【例文訳】その計画は期待通りにはうまくいかなかった。","etymology":"","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1656,"section":"Section 17 (準1級)","word":"come through","phrase":"He managed to come through the crisis.","meaning":"要求に応える、伝えられる","note":"【例文訳】彼は危機を乗り越えることができた。","etymology":"","preposition":"through は『通り抜ける』。過程を最後まで抜ける感覚。"},{"id":1657,"section":"Section 17 (準1級)","word":"comply with ~","phrase":"All employees must comply with the rules.","meaning":"(規則・基準など)に従う","note":"【例文訳】すべての従業員は規則に従わなければならない。","etymology":"","preposition":"with は『一緒に/伴って』。道具・相手・付帯状況を表す。"},{"id":1658,"section":"Section 17 (準1級)","word":"contribute to ~","phrase":"Exercise contributes to good health.","meaning":"〜の一因となる、〜に寄与[貢献]する〜に寄付する","note":"【例文訳】運動は健康に貢献する。","etymology":"","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1659,"section":"Section 17 (準1級)","word":"cope with ~","phrase":"She struggled to cope with the pressure.","meaning":"〜うまく処理する、〜に対処する","note":"【例文訳】彼女はそのプレッシャーに対処するのに苦労した。","etymology":"","preposition":"with は『一緒に/伴って』。道具・相手・付帯状況を表す。"},{"id":1660,"section":"Section 17 (準1級)","word":"count for ~","phrase":"Hard work counts for a lot in this job.","meaning":"〜の価値がある","note":"【例文訳】努力はこの仕事で大いに価値がある。","etymology":"","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1661,"section":"Section 17 (準1級)","word":"count on ~","phrase":"We can count on him when things get tough.","meaning":"〜を当てにする","note":"【例文訳】困難な時でも彼を当てにできる。","etymology":"【語源イメージ】count on：重さを“乗せる”→頼る","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動 文訳】その店は輸入品を扱っている。","etymology":"【語源イメージ】deal in：中で“扱う”→商う","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1670,"section":"Section 17 (準1級)","word":"deprive A of B","phrase":"The scandal deprived him of his position.","meaning":"AからBを奪う","note":"【例文訳】そのスキャンダルは彼から地位を奪った。","etymology":"【語源イメージ】deprive A of B：AからBを“奪い取る”","preposition":"of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。"},{"id":1671,"section":"Section 17 (準1級)","word":"die down","phrase":"The noise slowly died down.","meaning":"静まる、衰える","note":"【例文訳】騒音はゆっくりと静まった。","etymology":"【語源イメージ】die down：下に“沈む”→静まる","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1672,"section":"Section 17 (準1級)","word":"die out","phrase":"Many species are dying out due to climate change.","meaning":"絶滅する","note":"【例文訳】多くの種が気候変動で絶滅しつつある。","etymology":"【語源イメージ】die out：外へ“消える”→絶滅","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1673,"section":"Section 17 (準1級)","word":"dispose of ~","phrase":"We must dispose of the waste properly.","meaning":"〜を処分する、を捨てる","note":"【例文訳】廃棄物を適切に処理しなければならない。","etymology":"【語源イメージ】dispose of：離して“置く”→処分","preposition":"of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。"},{"id":1674,"section":"Section 17 (準1級)","word":"do away with ~","phrase":"They decided to do away with old regulations.","meaning":"〜を廃止する、〜を取り除く","note":"【例文訳】彼らは古い規則を廃止することにした。","etymology":"【語源イメージ】do away with：遠くへ“やる”→廃止","preposition":"with は『一緒に/伴って』。道具・相手・付帯状況を表す。"},{"id":1675,"section":"Section 17 (準1級)","word":"drag on","phrase":"The meeting dragged on for hours.","meaning":"(会議などがだらだらと)長引く","note":"【例文訳】会議は何時間もだらだら続いた。","etymology":"【語源イメージ】drag on：長く“引きずる”→長引く","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1676,"section":"Section 17 (準1級)","word":"drag out ~","phrase":"He dragged out the explanation unnecessarily.","meaning":"〜を(必要以上に)長引かせる","note":"【例文訳】彼は説明を不必要に引き延ばした。","etymology":"【語源イメージ】drag out：外へ“引き延ばす”","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1677,"section":"Section 17 (準1級)","word":"draw on ~","phrase":"The project drew on his past experience.","meaning":"(技術・経験など)に頼る、〜を利用する","note":"【例文訳】そのプロジェクトは彼の過去の経験を活用した。","etymology":"【語源イメージ】draw on：上に“描く”→頼る・活用","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1678,"section":"Section 17 (準1級)","word":"draw up ~","phrase":"They drew up a new contract.","meaning":"(計画)を立てる、(報告書など)を作成する","note":"【例文訳】彼らは新しい契約書を作成した。","etymology":"【語源イメージ】draw up：上へ“引く”→作成","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1679,"section":"Section 17 (準1級)","word":"dream up ~","phrase":"She dreamed up a strange idea.","meaning":"(奇抜な考え・計画など)を思いつく、〜を考え出す","note":"【例文訳】彼女は奇妙なアイデアを思いついた。","etymology":"【語源イメージ】dream up：上に“夢を描く”→思いつく","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1680,"section":"Section 17 (準1級)","word":"drive off [away] ~","phrase":"The police drove off the intruders.","meaning":"〜を追い払う","note":"【例文訳】警察は侵入者を追い払った。","etymology":"【語源イメージ】drive off：力で“追い払う”","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1681,"section":"Section 17 (準1級)","word":"drive up ~","phrase":"The new policy drove up prices quickly.","meaning":"(価格など)を急速に上昇させる","note":"【例文訳】新しい方針は価格を急上昇させた。","etymology":"【語源イメージ】drive up：上へ“押し上げる”→値上げ","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1682,"section":"Section 17 (準1級)","word":"drop back (to ~)","phrase":"Sales dropped back to last year’s level.","meaning":"(〜に)後退する、順位が下がる","note":"【例文訳】売上は昨年の水準まで戻った。","etymology":"【語源イメージ】drop back：後ろに“落ちる”→後退","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1683,"section":"Section 17 (準1級)","word":"drop out (of ~)","phrase":"He decided to drop out of college.","meaning":"(活動・集団から)身を引く、(学校を)中途退学する","note":"【例文訳】彼は大学を中退することにした。","etymology":"【語源イメージ】drop out：外へ“落ちる”→脱退・中退","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1684,"section":"Section 17 (準1級)","word":"ease into ~","phrase":"She eased into her new role smoothly.","meaning":"(仕事など)に徐々に慣れる","note":"【例文訳】彼女は新しい役割にゆっくり慣れていった。","etymology":"【語源イメージ】ease into：中へ“ゆっくり入る”→慣れる","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1685,"section":"Section 17 (準1級)","word":"eat up ~","phrase":"The kids ate up all the cookies.","meaning":"〜を使い果たす、〜を食べ尽くす","note":"【例文訳】子どもたちはクッキーを全部食べ尽くした。","etymology":"【語源イメージ】eat up：上へ“食い尽くす”→完食","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1686,"section":"Section 17 (準1級)","word":"embark on [upon] ~","phrase":"They embarked on a new project together.","meaning":"(事業など)に乗り出す、〜に着手する","note":"【例文訳】彼らは一緒に新しいプロジェクトに着手した。","etymology":"【語源イメージ】embark on：船に“乗る”→着手","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1687,"section":"Section 17 (準1級)","word":"endear A to B","phrase":"Her kindness endeared her to the whole community.","meaning":"AをBに慕わせる","note":"【例文訳】彼女の優しさは地域の人々に愛された。","etymology":"【語源イメージ】endear A to B：AをBに“愛させる”","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1688,"section":"Section 17 (準1級)","word":"even up ~","phrase":"The referee tried to even up the score.","meaning":"〜を等しくする、〜を均等にする","note":"【例文訳】審判は得点を均等にしようとした。","etymology":"【語源イメージ】even up：均等に“上げる”→均す","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1689,"section":"Section 17 (準1級)","word":"face off","phrase":"The two teams faced off in the final match.","meaning":"対決する","note":"【例文訳】2つのチームは決勝戦で対決した。","etymology":"【語源イメージ】face off：顔を“向け合う”→対決","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1690,"section":"Section 17 (準1級)","word":"fall away","phrase":"Old habits tend to fall away over time.","meaning":"減少する、弱まる、衰える","note":"【例文訳】古い習慣は時間とともに消えていく。","etymology":"【語源イメージ】fall away：離れて“落ちる”→消える","preposition":"away は『離れて』。"},{"id":1691,"section":"Section 17 (準1級)","word":"fall back on ~","phrase":"When in trouble, he falls back on his friends.","meaning":"〜を当てにする","note":"【例文訳】困ったとき、彼は友人に頼る。","etymology":"【語源イメージ】fall back on：後ろに“倒れて寄りかかる”→頼る","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1692,"section":"Section 17 (準1級)","word":"fall for ~","phrase":"He fell for the scam and lost money.","meaning":"(うまい話・売り込みなど)に乗せられる、〜に強く引きつけられる","note":"【例文訳】彼は詐欺に引っかかってお金を失った。","etymology":"【語源イメージ】fall for：〜に“落ちる”→騙される・惚れる","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1693,"section":"Section 17 (準1級)","word":"fall off","phrase":"Sales fell off sharply last month.","meaning":"(数・量が)減少する、(質が)低下する","note":"【例文訳】売上は先月急激に落ち込んだ。","etymology":"【語源イメージ】fall off：外へ“落ちる”→減少","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1694,"section":"Section 17 (準1級)","word":"fall on ~","phrase":"Responsibility falls on the manager.","meaning":"(責任・仕事などが)〜に降りかかる、(記念日などが)〜に当たる","note":"【例文訳】責任はマネージャーに降りかかる。","etymology":"【語源イメージ】fall on：上から“降りかかる”→責任・義務","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1695,"section":"Section 17 (準1級)","word":"fall through","phrase":"The plan fell through at the last minute.","meaning":"(計画などが)駄目になる、失敗する","note":"【例文訳】その計画は土壇場で失敗した。","etymology":"【語源イメージ】fall through：穴を“落ちる”→失敗","preposition":"through は『通り抜ける』。過程を最後まで抜ける感覚。"},{"id":1696,"section":"Section 17 (準1級)","word":"fall under ~","phrase":"This issue falls under environmental law.","meaning":"(影響・監督など)を受ける","note":"【例文訳】この問題は環境法の範囲に属する。","etymology":"【語源イメージ】fall under：下に“分類される”","preposition":"under は『下に/支配下』。"},{"id":1697,"section":"Section 17 (準1級)","word":"feel for ~","phrase":"I really feel for her situation.","meaning":"〜に同情する、〜を思いやる","note":"【例文訳】私は彼女の状況に本当に同情する。","etymology":"【語源イメージ】feel for：心を“伸ばす”→同情","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1698,"section":"Section 17 (準1級)","word":"figure out ~","phrase":"We need to figure out the solution.","meaning":"〜を理解する、〜を解決する","note":"【例文訳】解決策を見つける必要がある。","etymology":"【語源イメージ】figure out：形を“外へ取り出す”→理解","preposition":"out＝外に出して見える化。考えて答えを見つける。"},{"id":1699,"section":"Section 17 (準1級)","word":"fill out ~","phrase":"Please fill out the application form.","meaning":"(書類)に必要事項を記入する","note":"【例文訳】申込書に記入してください。","etymology":"【語源イメージ】fill out：外へ“満たす”→書き込む","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1700,"section":"Section 17 (準1級)","word":"fire up ~","phrase":"The coach fired up the team before the game.","meaning":"〜始動させる、〜に火をつける","note":"【例文訳】コーチは試合前にチームを奮い立たせた。","etymology":"【語源イメージ】fire up：火を“つける”→奮起させる","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1701,"section":"Section 18 (準1級)","word":"fit into ~","phrase":"The box didn’t fit into the small shelf.","meaning":"〜に溶け込む、〜に収まる","note":"【例文訳】その箱は小さな棚に収まらなかった。","etymology":"【語源イメージ】fit into：中に“収まる”","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1702,"section":"Section 18 (準1級)","word":"fix up ~","phrase":"They fixed up the old house before moving in.","meaning":"〜を修理する、〜を改装する","note":"【例文訳】彼らは引っ越す前に古い家を修繕した。","etymology":"【語源イメージ】fix up：上へ“整える”→修繕","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1703,"section":"Section 18 (準1級)","word":"for all ~","phrase":"For all his faults, he is still a good friend.","meaning":"〜にもかかわらず、〜を考慮しても","note":"【例文訳】欠点は多いが、彼は良い友人だ。","etymology":"【語源イメージ】for all：全部“ひっくるめても”","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1704,"section":"Section 18 (準1級)","word":"for the time being","phrase":"For the time being, let’s wait here.","meaning":"当分の間(は)、さしあたり","note":"【例文訳】当面の間、ここで待とう。","etymology":"【語源イメージ】for the time being：時間を“囲う”→当面","preposition":"for は『向かう先・目的・交換』。何のために向いているかを見る。"},{"id":1705,"section":"Section 18 (準1級)","word":"force down ~","phrase":"He forced down the bitter medicine.","meaning":"(感情など)を抑える","note":"【例文訳】彼は苦い薬を無理やり飲み込んだ。","etymology":"【語源イメージ】force down：下へ“押し込む”","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1706,"section":"Section 18 (準1級)","word":"free up ~","phrase":"This update will free up more storage space.","meaning":"〜を自由化する、〜解放する","note":"【例文訳】このアップデートで保存容量が増える。","etymology":"【語源イメージ】free up：上へ“解放する”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1707,"section":"Section 18 (準1級)","word":"frown on [upon] ~","phrase":"Many people frown on smoking indoors."," },{"id":1722,"section":"Section 18 (準1級)","word":"go back on ~","phrase":"He went back on his promise.","meaning":"(約束など)を破る","note":"【例文訳】彼は約束を破った。","etymology":"【語源イメージ】go back on：後ろに“戻って覆す”→約束破り","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1723,"section":"Section 18 (準1級)","word":"go for ~","phrase":"She decided to go for the blue dress.","meaning":"〜を選ぶ","note":"【例文訳】彼女は青いドレスを選ぶことにした。","etymology":"【語源イメージ】go for：〜へ“向かう”→選ぶ","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1724,"section":"Section 18 (準1級)","word":"grow into ~","phrase":"The small startup grew into a major company.","meaning":"(成長して)(服など)を着られるようになる","note":"【例文訳】その小さな会社は大企業へと成長した。","etymology":"【語源イメージ】grow into：中へ“成長して入る”","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1725,"section":"Section 18 (準1級)","word":"grow on ~","phrase":"The new song slowly grew on me.","meaning":"(人)の気にいるようになる、(習慣などが)〜の身につてくる","note":"【例文訳】その新曲はだんだん気に入ってきた。","etymology":"【語源イメージ】grow on：上に“乗る”→好きになる","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1726,"section":"Section 18 (準1級)","word":"grow out of ~","phrase":"He grew out of his childhood habits.","meaning":"(成長して)(行為・習慣など)から脱する、〜から生じる","note":"【例文訳】彼は子どもの頃の習慣を卒業した。","etymology":"【語源イメージ】grow out of：外へ“成長して抜ける”","preposition":"of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。 / out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1727,"section":"Section 18 (準1級)","word":"hand down ~","phrase":"The tradition was handed down through generations.","meaning":"(伝統・慣習など)を(後世に)伝える、(判決など)を言い渡す","note":"【例文訳】その伝統は世代を超えて受け継がれた。","etymology":"【語源イメージ】hand down：下へ“渡す”→伝承","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1728,"section":"Section 18 (準1級)","word":"hand off ~","phrase":"He handed off the responsibility to his assistant.","meaning":"〜を任せる、〜を引き渡す","note":"【例文訳】彼は責任を助手に引き渡した。","etymology":"【語源イメージ】hand off：離して“渡す”→引き継ぎ","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1729,"section":"Section 18 (準1級)","word":"hand out A (to B)","phrase":"The teacher handed out worksheets to the students.","meaning":"(Bに)Aを配る","note":"【例文訳】先生は生徒にプリントを配った。","etymology":"【語源イメージ】hand out：外へ“配る”","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1730,"section":"Section 18 (準1級)","word":"hang around (~)","phrase":"They spent the afternoon hanging around the park.","meaning":"(〜を)ぶらつく、うろつく","note":"【例文訳】彼らは午後、公園でぶらぶらして過ごした。","etymology":"【語源イメージ】hang around：周囲を“ぶらつく”","preposition":"around は『周辺をぐるり』。"},{"id":1731,"section":"Section 18 (準1級)","word":"hang on","phrase":"Hang on! I’m not finished yet.","meaning":"(少し)待つ、電話を切らずにおく","note":"【例文訳】ちょっと待って！まだ終わってない。","etymology":"【語源イメージ】hang on：しっかり“つかむ”→待つ","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。"},{"id":1732,"section":"Section 18 (準1級)","word":"hang up ~","phrase":"Please hang up the phone.","meaning":"(電話を)切る","note":"【例文訳】電話を切ってください。","etymology":"【語源イメージ】hang up：上に“掛ける”→電話を切る","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1733,"section":"Section 18 (準1級)","word":"head off (~)","phrase":"They headed off the problem before it got worse.","meaning":"〜を阻止する、〜を回避する、出かける、立ち去る","note":"【例文訳】彼らは問題が悪化する前に食い止めた。","etymology":"【語源イメージ】head off：前で“遮る”→阻止","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1734,"section":"Section 18 (準1級)","word":"head out","phrase":"We should head out before it gets dark.","meaning":"出かける、立ち去る","note":"【例文訳】暗くなる前に出発しよう。","etymology":"【語源イメージ】head out：外へ“向かう”→出発","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1735,"section":"Section 18 (準1級)","word":"hold back ~","phrase":"Fear held him back from speaking.","meaning":"〜を抑えておく","note":"【例文訳】恐怖が彼を発言するのを妨げた。","etymology":"【語源イメージ】hold back：後ろに“押し止める”","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1736,"section":"Section 18 (準1級)","word":"hold off ~","phrase":"Rain held off until evening.","meaning":"〜を引き延ばす、〜を延期する","note":"【例文訳】雨は夕方まで降らなかった。","etymology":"【語源イメージ】hold off：離して“遅らせる”","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1737,"section":"Section 18 (準1級)","word":"hold out (~)","phrase":"They held out hope for a miracle.","meaning":"(敵・逆境・圧力などに)もちこたえる、〜を差し出す","note":"【例文訳】彼らは奇跡を信じ続けた。","etymology":"【語源イメージ】hold out：外へ“伸ばす”→耐える・希望","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1738,"section":"Section 18 (準1級)","word":"hold over ~","phrase":"The meeting was held over until next week.","meaning":"続映[続演]される、〜を延期する","note":"【例文訳】会議は来週まで延期された。","etymology":"【語源イメージ】hold over：上に“残す”→延期","preposition":"over は『上を覆う/越える』。支配・終了・過剰にもつながる。"},{"id":1739,"section":"Section 18 (準1級)","word":"in a row","phrase":"They won three games in a row.","meaning":"連続で","note":"【例文訳】彼らは3試合連続で勝った。","etymology":"【語源イメージ】in a row：列の“中で連続”","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1740,"section":"Section 18 (準1級)","word":"in favor of ~","phrase":"She voted in favor of the new plan.","meaning":"〜に賛成して、〜を支持して","note":"【例文訳】彼女は新しい計画に賛成票を投じた。","etymology":"【語源イメージ】in favor of：賛成の“側に立つ”","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。 / of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。"},{"id":1741,"section":"Section 18 (準1級)","word":"in response to ~","phrase":"The company acted in response to customer feedback.","meaning":"〜に応えて、〜に応じて","note":"【例文訳】会社は顧客の意見に応じて行動した。","etymology":"【語源イメージ】in response to：反応の“中で”","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1742,"section":"Section 18 (準1級)","word":"in terms of ~","phrase":"In terms of cost, this option is better.","meaning":"〜の観点から","note":"【例文訳】費用の点では、この選択肢が良い。","etymology":"【語源イメージ】in terms of：観点の“枠内で”","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。 / of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。"},{"id":1743,"section":"Section 18 (準1級)","word":"in the event of ~","phrase":"In the event of an emergency, call this number.","meaning":"(万一)〜の場合には","note":"【例文訳】緊急時にはこの番号に電話してください。","etymology":"【語源イメージ】in the event of：出来事の“中で”","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。 / of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。"},{"id":1744,"section":"Section 18 (準1級)","word":"in vain","phrase":"He tried to fix the machine in vain.","meaning":"無駄に、効果なく、〜にすぐ飛びつく","note":"【例文訳】彼は機械を直そうとしたが無駄だった。","etymology":"【語源イメージ】in vain：空っぽの“中で”→無駄","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1745,"section":"Section 18 (準1級)","word":"jump at ~","phrase":"She jumped at the chance to study abroad.","meaning":"〜にすぐ飛びつく","note":"【例文訳】彼女は留学の機会に飛びついた。","etymology":"【語源イメージ】jump at：〜に“飛びつく”","preposition":"at は『点』。場所・時刻・狙いを一点として見る。"},{"id":1746,"section":"Section 18 (準1級)","word":"keep track of ~","phrase":"I need to keep track of my expenses.","meaning":"(人の動向・情勢など)に注意している、〜の跡をたどる","note":"【例文訳】出費を記録する必要がある。","etymology":"【語源イメージ】keep track of：軌跡を“保つ”→記録","preposition":"of は『切り離して取り出す/所属』。全体から一部を取り出す感覚。"},{"id":1747,"section":"Section 18 (準1級)","word":"keep up with ~","phrase":"He can’t keep up with the fast pace.","meaning":"(時勢・流行・人・仕事・勉強など)に遅れずについていく","note":"【例文訳】彼はその速いペースについていけない。","etymology":"【語源イメージ】keep up with：上に“ついていく”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。 / with は『一緒に/伴って』。道具・相手・付帯状況を表す。"},{"id":1748,"section":"Section 18 (準1級)","word":"kick around ~","phrase":"They kicked around several ideas.","meaning":"(計画・提案など)をあれこれ検討する","note":"【例文訳】彼らはいくつかのアイデアをあれこれ検討した。","etymology":"【語源イメージ】kick around：周囲を“蹴り回す”→検討","preposition":"around は『周辺をぐるり』。"},{"id":1749,"section":"Section 18 (準1級)","word":"kick in","phrase":"The medicine will kick in after ten minutes.","meaning":"(薬などが)効き始める、機能し始める","note":"【例文訳】薬は10分後に効き始める。","etymology":"【語源イメージ】kick in：中に“蹴り込む”→効き始める","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1750,"section":"Section 18 (準1級)","word":"kick off A (with B)","phrase":"The event kicked off with a welcome speech.","meaning":"(Bで)Aを開始する","note":"【例文訳】イベントは歓迎スピーチで始まった。","etymology":"【語源イメージ】kick off：外へ“蹴り出す”→開始","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1751,"section":"Section 18 (準1級)","word":"kick A out (of B)","phrase":"They kicked him out of the club.","meaning":"(Bから)Aを追い出す[首にする]","note":"【例文訳】彼らは彼をクラブから追い出した。","etymology":"【語源イメージ】kick out：外へ“蹴り出す”→追放","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1752,"section":"Section 18 (準1級)","word":"knock down ~","phrase":"The storm knocked down several trees.","meaning":"〜を取り壊す、〜を解体する、〜を殴り倒す","note":"【例文訳】嵐は何本もの木を倒した。","etymology":"【語源イメージ】knock down：下へ“倒す”","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1753,"section":"Section 18 (準1級)","word":"lay into ~","phrase":"She suddenly laid into him for being late.","meaning":"〜を厳しく非難する、〜を攻撃する","note":"【例文訳】彼女は遅刻した彼を突然激しく非難した。","etymology":"【語源イメージ】lay into：中に“叩き込む”→激しく非難","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1754,"section":"Section 18 (準1級)","word":"lay off ~","phrase":"The company had to lay off many workers.","meaning":"(一時的にまたは永久に) 〜を解雇する","note":"【例文訳】会社は多くの従業員を解雇しなければならなかった。","etymology":"【語源イメージ】lay off：離して“置く”→解雇","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1755,"section":"Section 18 (準1級)","word":"leave off (~)","phrase":"Let’s leave off here for today.","meaning":"(〜を)やめる","note":"【例文訳】今日はここまでにしよう。","etymology":"【語源イメージ】leave off：離れて“終える”","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1756,"section":"Section 18 (準1級)","word":"let alone ~","phrase":"I can’t afford a new car, let alone a house.","meaning":"まして〜、〜は言うまでもなく","note":"【例文訳】家はもちろん、新車を買う余裕もない。","etymology":"【語源イメージ】let alone：〜は“言うまでもなく”","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1757,"section":"Section 18 (準1級)","word":"let down ~","phrase":"He felt that his friends let him down.","meaning":"〜を失望させる、〜(の期待・信頼)を裏切る","note":"【例文訳】彼は友人に失望させられたと感じた。","etymology":"【語源イメージ】let down：下へ“落とす”→失望","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1758,"section":"Section 18 (準1級)","word":"let out ~","phrase":"The teacher let out a loud sigh.","meaning":"(声など)を出す、(感情)を表す、〜を外に出す","note":"【例文訳】先生は大きなため息をついた。","etymology":"【語源イメージ】let out：外へ“出す”→漏らす","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1759,"section":"Section 18 (準1級)","word":"let up","phrase":"The rain finally let up.","meaning":"手を緩める、(望ましくないことが)弱まる、(風雨などが)やむ","note":"【例文訳】雨はついに弱まった。","etymology":"【語源イメージ】let up：上の力が“弱まる”","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1760,"section":"Section 18 (準1級)","word":"level off [out]","phrase":"Sales leveled off after a sharp rise.","meaning":"横ばいになる、安定する","note":"【例文訳】売上は急上昇後、横ばいになった。","etymology":"【語源イメージ】level off：水平に“均す”→横ばい","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1761,"section":"Section 18 (準1級)","word":"lift off","phrase":"The rocket lifted off smoothly.","meaning":"(飛行機などが)離陸する","note":"【例文訳】ロケットは滑らかに打ち上がった。","etymology":"【語源イメージ】lift off：上へ“持ち上がる”→離陸","preposition":"off は『離れる』。接触・予定・作動状態から離す。"},{"id":1762,"section":"Section 18 (準1級)","word":"live up to ~","phrase":"He tried to live up to his parents’ expectations.","meaning":"(期待など)に応える、(規範など)に従って行動する","note":"【例文訳】彼は両親の期待に応えようとした。","etymology":"【語源イメージ】live up to：上の基準に“生きる”→期待に応える","preposition":"up は『上へ』から『増加・完成・出現』へ広がる。"},{"id":1763,"section":"Section 18 (準1級)","word":"lock in ~","phrase":"They locked in the final price for the deal.","meaning":"〜を固定する、(鍵をかけて)〜を閉じ込める","note":"【例文訳】彼らは取引の最終価格を固定した。","etymology":"【語源イメージ】lock in：中に“閉じ込める”→固定","preposition":"in は『広い』ではなく『中に入っている/範囲内』。時間・状態・言語も容器のように捉える。"},{"id":1764,"section":"Section 18 (準1級)","word":"look down on ~","phrase":"She tends to look down on people who brag.","meaning":"〜を見下す、〜を軽蔑する","note":"【例文訳】彼女は自慢する人を見下す傾向がある。","etymology":"【語源イメージ】look down on：下に“見る”→見下す","preposition":"down on＝下に見て接触する。見下す。"},{"id":1765,"section":"Section 18 (準1級)","word":"make (both) ends meet","phrase":"It’s hard to make both ends meet these days.","meaning":"(収支を合わせて)収入内で何とかやりくりする","note":"【例文訳】最近は生活費のやりくりが難しい。","etymology":"【語源イメージ】make ends meet：両端を“合わせる”→やりくり","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1766,"section":"Section 18 (準1級)","word":"make do with ~","phrase":"We’ll have to make do with what we have.","meaning":"(あり合わせのもの)で済ます","note":"【例文訳】あるものでなんとかやりくりしなければならない。","etymology":"【語源イメージ】make do with：あるもので“やりくり”","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1767,"section":"Section 18 (準1級)","word":"make it","phrase":"He finally made it to the top.","meaning":"間に合う、成功する、(会合などに)出席できる","note":"【例文訳】彼はついに頂点に到達した。","etymology":"【語源イメージ】make it：そこに“到達する”","preposition":"熟語は『動詞の核』＋『前置詞/副詞の空間イメージ』で覚えると、丸暗記より崩れにくい。"},{"id":1768,"section":"Section 18 (準1級)","word":"make out (~)","phrase":"I couldn’t make out what he was saying.","meaning":"〜を理解する、うまくやる","note":"【例文訳】彼が何を言っているのか聞き取れなかった。","etymology":"【語源イメージ】make out：外へ“意味を取り出す”→理解・判別","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1769,"section":"Section 18 (準1級)","word":"make over ~","phrase":"They made over the old building into a café.","meaning":"〜を作り変える、〜変身させる","note":"【例文訳】彼らは古い建物を改装してカフェにした。","etymology":"【語源イメージ】make over：上から“作り替える”→改装","preposition":"over は『上を覆う/越える』。支配・終了・過剰にもつながる。"},{"id":1770,"section":"Section 18 (準1級)","word":"mark down ~","phrase":"The store marked down all winter items.","meaning":"〜を値下げする、〜を書き留める","note":"【例文訳】店は冬物を値下げした。","etymology":"【語源イメージ】mark down：下へ“印をつける”→値下げ","preposition":"down は『下へ』から『低下・記録・鎮静・故障』へ広がる。"},{"id":1771,"section":"Section 18 (準1級)","word":"mark out ~","phrase":"They marked out the area for construction.","meaning":"(線などで)〜を区画する、〜を区切る","note":"【例文訳】彼らは建設区域を区画した。","etymology":"【語源イメージ】mark out：外へ“線を引く”→区画","preposition":"out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1772,"section":"Section 18 (準1級)","word":"miss out on ~","phrase":"He missed out on the opportunity.","meaning":"(機会・好機など)を逸する","note":"【例文訳】彼はその機会を逃した。","etymology":"【語源イメージ】miss out on：外に“落ちる”→逃す","preposition":"on は『上』より『くっついている/接触/継続』。依存・継続・作動中の感覚に広がる。 / out は『外へ』。隠れたものが外に出て見える/尽きる/実行される。"},{"id":1773,"section":"Section 18 (準1級)","word":"narrow down ~","phrase":"We need to narrow down the choices.","meaning":"(範囲など)を制限する、〜を狭
